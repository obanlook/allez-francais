/* ---- rough "sounds like" phonetic fallback for whenever the AI forgets to supply one ---- */
function frPhon(raw){
  return String(raw).split(/\s+/).map(word=>{
    let w=word.toLowerCase().normalize('NFD').replace(/́|̀|̂|̈|̧/g,m=>({['́']:'´',['̀']:'`',['̂']:'^',['̈']:'¨',['̧']:'¸'}[m]));
    w=word.toLowerCase();
    const rules=[
      [/ph/g,'f'],[/th/g,'t'],[/qu/g,'k'],[/gn/g,'ny'],[/ch/g,'sh'],
      [/eau|au/g,'oh'],[/oi/g,'wa'],[/ou/g,'oo'],[/eu|œu/g,'euh'],
      [/an|am|en|em/g,'ahn'],[/on|om/g,'ohn'],[/ain|ein|in|im|yn/g,'an'],[/un|um/g,'uhn'],
      [/ill/g,'eey'],[/ë|ê|è/g,'eh'],[/é/g,'ay'],[/ç/g,'s'],[/'/g,''],
      [/[td]$/,''],[/s$/,''],[/e$/,''],[/rs$/,'r'],
    ];
    let out=w;rules.forEach(([re,rep])=>out=out.replace(re,rep));
    out=out.replace(/[^a-z-]/g,'');
    return out||w;
  }).join('-').toUpperCase();
}
/* ---- turn model markdown into CLEAN structured HTML (no stray # or - bullets) ---- */
function aiFormat(raw){
  const lines=String(raw).replace(/\r/g,'').split('\n');
  let html='',list=null,para=[];
  const inline=t=>{
    // pull out «french» (optional existing pronunciation) BEFORE escaping, so we can guarantee
    // every French chip gets a speaker + "sounds like" hint up front — before any explanation
    const toks=[];
    const marked=String(t).replace(/«\s*([^»]+?)\s*»(?:\s*\(([^()]{1,70})\)\s*(?:\((?:[^()]{1,70})\))?)?/g,(m,fr,ph)=>{
      const phon=(ph&&!/^(to |the |a |an )/i.test(ph.trim()))?ph.trim():frPhon(fr);
      const i=toks.length;
      toks.push(`<span class="aifr">« ${esc(fr)} »<span class="aiphon">${esc(phon)}</span>`
        +`<button class="say mini" aria-label="Écouter" onclick="say(${sattr(fr)})">${SPK}</button></span>`);
      return ''+i+'';
    });
    let out=esc(marked)
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g,'$1<i>$2</i>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
    out=out.replace(/(\d+)/g,(m,i)=>toks[+i]);
    return out;
  };
  const flushP=()=>{if(!para.length)return;const t=para.join(' ').replace(/\s+/g,' ').trim();para=[];
    const m=t.match(/^([^:]{2,40}):\s+(.+)$/);
    html+=m?`<p class="aip"><b class="ailab">${inline(m[1])}</b> ${inline(m[2])}</p>`:`<p class="aip">${inline(t)}</p>`;};
  const closeL=()=>{if(list){html+='</'+list+'>';list=null;}};
  const flushAll=()=>{flushP();closeL();};
  for(let ln of lines){
    const t=ln.trim();
    if(!t){flushAll();continue;}
    let m;
    if(m=t.match(/^#{1,6}\s*(.+)$/)){flushAll();html+=`<h4 class="aih">${inline(m[1].replace(/[*_`]/g,'').replace(/[:：]\s*$/,''))}</h4>`;continue;}
    if(/^([-–—*_]\s?){3,}$/.test(t)){flushAll();html+='<hr class="aihr">';continue;}
    if(m=t.match(/^[-*•]\s+(.+)$/)){flushP();if(list!=='ul'){closeL();html+='<ul class="aiul">';list='ul';}html+=`<li>${inline(m[1])}</li>`;continue;}
    if(m=t.match(/^\d+[.)]\s+(.+)$/)){flushP();if(list!=='ol'){closeL();html+='<ol class="aiol">';list='ol';}html+=`<li>${inline(m[1])}</li>`;continue;}
    // plain line = a wrapped continuation → append, don't start a new block
    if(list){html=html.replace(/<\/li>\s*$/,' '+inline(t)+'</li>');continue;}
    para.push(t);
  }
  flushAll();return html;
}

async function aiSend(){
  const inp=document.getElementById('aiInput');const q=(inp.value||'').trim();if(!q)return;
  inp.value='';aiPush('you',q);
  const prompt=aiContext(q);
  const key=aiKey();
  if(!key){   // no key → copy-and-open flow (fully offline-first)
    try{await navigator.clipboard.writeText(prompt);}catch(e){}
    aiPush('ai','<p class="aip"><b class="ailab">Prompt copié</b> avec tout ton contexte. Colle-le dans ton IA :</p>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'
      +'<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://aistudio.google.com/prompts/new_chat">Google AI Studio</a>'
      +'<a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://claude.ai/new">Claude</a></div>'
      +'<p class="aip muted" style="font-size:12px">Ajoute ta clé Google AI Studio ci-dessous pour discuter directement ici.</p>');
    return;
  }
  aiPush('load','');
  // try the chosen model, then fall back through any others the key supports
  const chain=[aiModel(),...aiModels,...AI_PREF].filter((m,i,a)=>m&&a.indexOf(m)===i);
  let lastErr='',quotaHit=false;
  for(const model of chain){
    try{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),
        {method:'POST',headers:{'content-type':'application/json'},
         body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.4,maxOutputTokens:1600}})});
      const j=await r.json();
      if(r.ok && j?.candidates?.[0]?.content){
        const txt=j.candidates[0].content.parts.map(p=>p.text).join('');
        if(model!==aiModel())aiSetModel(model);   // remember the one that worked
        AIQ.pop();aiPush('ai',aiFormat(txt),txt);aiPaint();return;
      }
      const em=(j?.error?.message)||('HTTP '+r.status);lastErr=em;
      if(r.status===429||/quota|limit: 0/i.test(em))quotaHit=true;
      // 404 (model not found) / 429 (quota) → try next model; other errors → stop
      if(r.status!==404 && r.status!==429 && !/not found|quota|limit: 0/i.test(em)){break;}
    }catch(e){lastErr=e.message;}
  }
  AIQ.pop();
  const retry=(lastErr.match(/retry in ([\d.]+)s/i)||[])[1];
  aiPush('ai',`<p class="aip warn"><b class="ailab">Aucun modèle disponible avec cette clé.</b> ${esc(lastErr).slice(0,180)}</p>`
    +(quotaHit?`<p class="aip">Ton projet Google a une limite <b>gratuite de 0</b> sur ces modèles${retry?` (réessaie dans ~${Math.ceil(retry)}s)`:''}. Deux options :</p>
       <ul class="aiul"><li>Choisis un autre modèle dans le menu ci-dessous (ex. <b>gemini-2.5-flash</b> ou <b>gemini-1.5-flash</b>).</li>
       <li>Ou crée une NOUVELLE clé sur un <b>nouveau projet</b> dans Google AI Studio — les vieux projets ont parfois un quota gratuit à 0.</li></ul>`
     :`<p class="aip">Vérifie la clé, ou choisis un autre modèle ci-dessous.</p>`)
    +`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://aistudio.google.com/apikey">Nouvelle clé Google</a>
        <button class="btn ghost" onclick="aiDiscover()">${icon('refresh')} Re-vérifier les modèles</button></div>`);
}

   "Je parle français et un peu anglais. Je suis étudiante. J'aime lire et écouter de la musique.",
   q:[
    {q:"Comment s'appelle la personne ?",o:['Sophie','Marie','Camille'],a:0},
    {q:"Quel âge a-t-elle ?",o:['vingt ans','vingt-cinq ans','trente ans'],a:1},
    {q:"D'où vient-elle ?",o:['Paris','Lyon','Nice'],a:1},
    {q:"Où habite-t-elle maintenant ?",o:['à Lyon','à Paris','à Marseille'],a:1},
   ]},
 {lv:1,title:'La famille de Marc',text:
   "Marc a une grande famille. Il a une sœur et deux frères. Sa mère est professeure et son père est médecin. "+
   "Ils habitent dans une maison avec un jardin. Le week-end, ils mangent ensemble et parlent beaucoup.",
   q:[
    {q:'Combien de frères a Marc ?',o:['un','deux','trois'],a:1},
    {q:'Quel est le métier de sa mère ?',o:['médecin','professeure','étudiante'],a:1},
    {q:'Quel est le métier de son père ?',o:['professeur','ingénieur','médecin'],a:2},
    {q:'Que font-ils le week-end ?',o:['ils travaillent','ils mangent ensemble','ils voyagent'],a:1},

   "Ensuite, je prends le petit-déjeuner : du pain, du beurre et un café. Je vais au travail en métro. "+
   "Le soir, je rentre à la maison vers dix-neuf heures et je dîne avec ma famille. Enfin, je me couche vers vingt-trois heures.",
   q:[

    {q:'Comment va-t-elle au travail ?',o:['en voiture','à pied','en métro'],a:2},
    {q:'À quelle heure rentre-t-elle le soir ?',o:['dix-huit heures','dix-neuf heures','vingt heures'],a:1},
   ]},
 {lv:2,title:'Au marché',text:
   "Le samedi matin, Aïcha va au marché près de chez elle. Elle achète des fruits, des légumes et du fromage. "+

    {q:'Combien coûtent ses achats ?',o:['cinq euros','cinq euros cinquante','six euros'],a:1},
    {q:'Comment paye-t-elle ?',o:['en espèces','par carte','elle ne paye pas'],a:1},

 {lv:3,title:'Le week-end de Julien',text:
   "Julien n'aime pas rester à la maison le week-end. Samedi dernier, il est allé au cinéma avec des amis, "+
   "puis ils ont mangé dans un restaurant italien. Dimanche, il s'est levé tard parce qu'il était fatigué. "+

   "même s'il doit maintenant retourner au travail lundi matin.",
   q:[
    {q:'Où est allé Julien samedi ?',o:['au parc','au cinéma','au travail'],a:1},
    {q:"Pourquoi s'est-il levé tard dimanche ?",o:['il travaillait','il était fatigué','il pleuvait'],a:1},
    {q:"Qu'a-t-il fait l'après-midi ?",o:['une promenade avec son chien','du sport','les courses'],a:0},
    {q:'Que doit-il faire lundi ?',o:['se reposer','retourner au travail','voyager'],a:1},

let readI=0,readAns={},readShown=false;
function readLoad(i){readI=(i+READING.length)%READING.length;readAns={};readShown=false;gamesRenderLE();}
function readPassage(){return READING[readI];}
function readAnswer(qi,oi){if(readShown)return;readAns[qi]=oi;gamesRenderLE();}
function readCheck(){readShown=true;
  const p=readPassage();let score=0;p.q.forEach((qq,i)=>{if(readAns[i]===qq.a)score++;});
  PROG.readBest=PROG.readBest||{};PROG.readBest[readI]=Math.max(PROG.readBest[readI]||0,score);
  PROG.readDone=PROG.readDone||{};PROG.readDone[readI]=true;progSave();gamesRenderLE();
}
function readCard(){
  const p=readPassage(),n=p.q.length;
  const answered=Object.keys(readAns).length;
  const score=readShown?p.q.reduce((a,qq,i)=>a+(readAns[i]===qq.a?1:0),0):0;
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">${icon('book-open')} ${esc(p.title)} <span class="muted" style="font-size:12px;font-weight:600">· niveau ${p.lv} · texte ${readI+1}/${READING.length}</span></h3>
      <button class="say" aria-label="Lire le texte" onclick="say(${sattr(p.text)},{rate:0.85})">${SPK}</button>
    </div>
    <p class="aip" style="font-size:var(--f-md);line-height:1.75;margin-top:10px">${esc(p.text)}</p>
    <h3 style="margin-top:18px">${icon('help')} Compréhension</h3>
    ${p.q.map((qq,i)=>`<div style="margin:12px 0">
      <div class="q" style="font-size:var(--f-md);margin-bottom:7px">${i+1}. ${esc(qq.q)}</div>
      ${qq.o.map((op,oi)=>{
        const chosen=readAns[i]===oi;
        let cls='quizopt';
        if(readShown){if(oi===qq.a)cls+=' correct';else if(chosen)cls+=' wrong';}
        else if(chosen)cls+=' correct';
        return `<button class="${cls}" ${readShown?'disabled':''} onclick="readAnswer(${i},${oi})">${esc(op)}</button>`;}).join('')}
    </div>`).join('')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      ${readShown?'':`<button class="btn" onclick="readCheck()" ${answered<n?'disabled':''}>${icon('check')} Vérifier (${answered}/${n})</button>`}
      ${readShown?`<span class="btn ghost" style="pointer-events:none">${icon('award')} ${score}/${n} correct</span>`:''}
      <button class="btn ghost" onclick="askAI('Lecture',${sattr('Voici un texte de compréhension française : « '+p.text+' ». Je veux améliorer ma compréhension écrite. Explique les 3 phrases les plus difficiles du texte, mot par mot.')})">${icon('brain')} Aide-moi avec ce texte</button>
    </div>
    <div class="fond-nav">
      <button class="btn ghost" onclick="readLoad(${readI-1})">${icon('arrow-l')} Texte précédent</button>
      <button class="btn ghost" onclick="readLoad(${readI+1})">Texte suivant ${icon('arrow-r')}</button>
    </div>
  </div>`;
}
TABS['Lecture']=()=>`${fhero('book-open','Lecture — comprendre un texte','Lis le texte à voix basse, puis à voix haute (🔊 pour le modèle), puis réponds aux questions sans regarder le texte si possible.')}${readCard()}`;

const WRITING=[
 {t:'Présente-toi',prompt:"Écris 4-5 phrases pour te présenter : ton nom, ton pays, ta ville, tes langues et ton métier.",
  hint:'Je m’appelle… / Je viens de… / J’habite à… / Je parle… / Je suis…',min:20},
 {t:'Ta journée',prompt:"Décris ta routine du matin en 3-4 phrases. Utilise d'abord, ensuite, puis, enfin.",
  hint:'D’abord, je… Ensuite, je… Enfin, je…',min:20},
 {t:'Ta famille',prompt:"Décris ta famille : qui sont-ils, où habitent-ils, que font-ils ?",
  hint:'J’ai … frères/sœurs. Mon père est… Ma mère est…',min:20},
 {t:'Un email au café',prompt:"Écris un court message pour réserver une table dans un restaurant pour deux personnes samedi soir.",
  hint:'Bonjour, je voudrais réserver… Nous sommes deux personnes…',min:15},
 {t:'Ton week-end',prompt:"Raconte ce que tu as fait le week-end dernier, en 4-5 phrases.",
  hint:'Samedi, je suis allé(e)… Dimanche, j’ai…',min:20},
 {t:'La météo',prompt:"Décris le temps qu'il fait aujourd'hui et ce que tu vas faire à cause de la météo.",
  hint:'Il fait… Il y a… Je vais…',min:15},
];
let writeI=0;
function writeLoad(i){writeI=(i+WRITING.length)%WRITING.length;gamesRenderLE();
  const ta=document.getElementById('writeTA');if(ta)ta.value=PROG.writeDrafts?.[writeI]||'';}
function writeSave(){const ta=document.getElementById('writeTA');if(!ta)return;
  PROG.writeDrafts=PROG.writeDrafts||{};PROG.writeDrafts[writeI]=ta.value;progSave();}
function writeCheck(){
  const ta=document.getElementById('writeTA');const fb=document.getElementById('writeFB');
  const w=WRITING[writeI];const text=(ta?.value||'').trim();
  if(!text){fb.innerHTML='<p class="aip warn">Écris quelque chose d’abord !</p>';return;}
  const words=text.split(/\s+/).filter(Boolean).length;
  PROG.writeDone=PROG.writeDone||{};PROG.writeDone[writeI]=true;
  PROG.writeDrafts=PROG.writeDrafts||{};PROG.writeDrafts[writeI]=text;progSave();
  const short=words<w.min;
  fb.innerHTML=`<div class="callout${short?' warn':''}">${icon(short?'zap':'check')}<div>
    ${short?`<b>Un peu court</b> — tu as ${words} mots, essaie d’en écrire au moins ${w.min}.`:`<b>Bien !</b> ${words} mots écrits.`}
    Envoie ton texte à l’IA pour une correction détaillée.</div></div>`;
  if(EN)applyEN(fb);
}
function writeAICheck(){
  const ta=document.getElementById('writeTA');const text=(ta?.value||'').trim();
  if(!text)return;
  askAI('Écriture',`Corrige ce texte français d'un niveau A1 : « ${text} ». Liste chaque erreur (grammaire, genre, conjugaison, orthographe) avec la correction et une explication très simple. Termine par une version corrigée complète du texte, entre guillemets.`);
}
function writeCard(){
  const w=WRITING[writeI],draft=PROG.writeDrafts?.[writeI]||'';
  return `<div class="card">
    <h3 style="margin:0">${icon('type')} ${esc(w.t)} <span class="muted" style="font-size:12px;font-weight:600">· sujet ${writeI+1}/${WRITING.length}</span></h3>
    <p class="aip" style="margin-top:8px">${esc(w.prompt)}</p>
    ${callout('Aide : <span class="aifr" style="display:inline">'+esc(w.hint)+'</span> · objectif ~'+w.min+' mots')}
    <textarea id="writeTA" rows="6" placeholder="Écris ta réponse ici…" oninput="writeSave()" style="margin-top:10px;font-size:var(--f-md);line-height:1.6">${esc(draft)}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="btn" onclick="writeCheck()">${icon('check')} Compter mes mots</button>
      <button class="btn ghost" onclick="writeAICheck()">${icon('brain')} Corriger avec l’IA</button>
    </div>
    <div id="writeFB" style="margin-top:10px"></div>
    <div class="fond-nav">
      <button class="btn ghost" onclick="writeLoad(${writeI-1})">${icon('arrow-l')} Sujet précédent</button>
      <button class="btn ghost" onclick="writeLoad(${writeI+1})">Sujet suivant ${icon('arrow-r')}</button>
    </div>
  </div>`;
}
TABS['Écriture']=()=>`${fhero('type','Écriture — produire un texte','Écris librement, sans avoir peur des fautes. Envoie ensuite ton texte à l’IA : elle corrige chaque erreur et explique pourquoi, comme un prof patient.')}${writeCard()}`;
/* shared re-render for the tabs added in this module (keeps textarea state where possible) */
function gamesRenderLE(keepFocus){
  ['Lecture','Écriture'].forEach(n=>{const el=document.querySelector(`[data-tab="${n}"]`);
    if(el&&el.classList.contains('active')){el.innerHTML=TABS[n]();if(EN)applyEN(el);}});
}

const BUCKETS=[
 {id:'Accueil',   icon:'home',  t:['Départ','Mon Profil','Points faibles']},
 {id:'Fondations',icon:'layers',t:['Alphabet','Accents','Sons','Grammaire']},
 {id:'Apprendre', icon:'grad',  t:['Leçons','Anatomie']},
 {id:'Lire & écrire',icon:'book-open',t:['Lecture','Écriture']},
 {id:'Pratiquer', icon:'mic',   t:['Chunks','Prononciation','Blocs','Jeux','Conversation','Examen']},
 {id:'Références', icon:'grid',  t:['Vocabulaire','Chiffres & Heure']},
];
const TABIC={'Départ':'home','Mon Profil':'user','Points faibles':'target','Alphabet':'type','Accents':'flag',
 'Sons':'waveform','Grammaire':'book','Leçons':'book-open','Anatomie':'scan','Chunks':'headphones','Prononciation':'mic',
 'Blocs':'layers','Jeux':'grid','Conversation':'message','Examen':'award','Vocabulaire':'grid','Chiffres & Heure':'hash',
 'Lecture':'book-open','Écriture':'type'};
const ALLTABS=BUCKETS.flatMap(b=>b.t);
const nav=document.getElementById('nav'),sub=document.getElementById('subnav'),mainEl=document.querySelector('main');
ALLTABS.forEach(name=>{const d=document.createElement('div');d.className='tab';d.dataset.tab=name;mainEl.appendChild(d);});
BUCKETS.forEach(b=>{const btn=document.createElement('button');btn.innerHTML=icon(b.icon)+'<span>'+b.id+'</span>';btn.dataset.bucket=b.id;btn.onclick=()=>show(b.t[0]);nav.appendChild(btn);});
function renderSub(b,active){
  sub.innerHTML='';
  b.t.forEach(t=>{const btn=document.createElement('button');btn.innerHTML=icon(TABIC[t]||'dots')+'<span>'+t+'</span>';btn.className=(t===active?'active':'');btn.onclick=()=>show(t);sub.appendChild(btn);});
}
function goFS(el){
  var target=el.closest('.tab');if(!target)return;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }else{
    (target.requestFullscreen||target.webkitRequestFullscreen).call(target).catch(function(){});
  }
}
function injectFS(tab){
  if(tab.querySelector('.fs-btn'))return;
  var btn=document.createElement('button');btn.className='fs-btn';btn.title='Plein écran';
  btn.setAttribute('aria-label','Toggle fullscreen');
  btn.innerHTML=icon('maximize');btn.onclick=function(){goFS(this);};
  tab.prepend(btn);
}
function show(name){
  closeMenu();
  if(name!=='Chunks'){try{stopLoop();if(SES.on)sesStop();}catch(e){}}  // no orphaned audio
  const b=BUCKETS.find(x=>x.t.includes(name))||BUCKETS[0];
  [...nav.children].forEach(x=>x.classList.toggle('active',x.dataset.bucket===b.id));
  renderSub(b,name);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  const t=document.querySelector(`[data-tab="${name}"]`);const first=!t.dataset.loaded;
  const reload=['Départ','Mon Profil','Leçons','Points faibles','Chunks','Alphabet','Accents','Sons','Jeux','Lecture','Écriture'];
  if(first||reload.includes(name)){t.innerHTML=TABS[name]();t.dataset.loaded=1;}
  injectFS(t);
  if(name==='Vocabulaire'&&first)initFC();
  if(name==='Grammaire'&&first){if(!qRestore())qStart();}
  if(name==='Prononciation'&&first)echoInit();
  if(name==='Chiffres & Heure')setTimeout(newClock,30);
  window.scrollTo(0,0);
  if(EN){applyEN(t);applyEN(sub);}   // backstop, scoped (not the whole body — avoids re-walking every accumulated tab)
}
/* mount the always-on-standby AI layer */
document.body.insertAdjacentHTML('beforeend',aiPanelHTML());
aiPaint(); aiSelInit(); if(aiKey())aiDiscover();
{const ss=loadSession('scrmini');if(ss&&ss.scrTiles){scrTiles=ss.scrTiles;scrPick=ss.scrPick||[];scrScore=ss.scrScore||0;scrFound=ss.scrFound||[];}};
if(!scrTiles.length)scrDeal();
if(!bbRestore())bbLoad(0);            // deal the first Building-Blocks exercise
show('Départ');
if(EN){const btn=document.getElementById('enToggle');if(btn){btn.classList.add('active');btn.innerHTML=icon('globe')+' Français';}applyEN(document.body);}
initAuth();
</script>
