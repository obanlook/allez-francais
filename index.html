<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b14">
<title>Allez! · French from zero</title>
<style>
  :root{
    /* core palette (refined) */
    --bg:#090b14; --bg2:#0d1020; --card:#141a2c; --card2:#1b2238; --card3:#232c48;
    --ink:#eef1fb; --ink2:#c7cdf0; --muted:#8b93bd; --faint:#5a6293;
    --accent:#ffc24b; --accent2:#7aa2ff; --good:#3ee0a0; --bad:#ff6b7d;
    --line:#262e4d; --line2:#333d63; --fr:#5b78ff; --fr2:#8b6bff; --rose:#ff5c8a; --teal:#38d6c8;
    /* type scale */
    --f-xs:11px; --f-sm:13px; --f-md:15px; --f-lg:17px; --f-xl:21px; --f-2xl:27px; --f-3xl:38px;
    /* space + shape */
    --sp:8px; --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
    --sh:0 6px 22px rgba(0,0,0,.35); --sh-lg:0 14px 40px rgba(0,0,0,.5);
    --grad:linear-gradient(135deg,var(--fr),var(--fr2));
    --grad-warm:linear-gradient(135deg,var(--accent),var(--rose));
    --ease:cubic-bezier(.4,0,.2,1);
    color-scheme:dark;
  }
  /* ---- LIGHT THEME override (toggle sets data-theme on <html>) ---- */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f5f6fb; --bg2:#eef0f9; --card:#ffffff; --card2:#f1f3fb; --card3:#e7eafa;
    --ink:#161a2e; --ink2:#333a5c; --muted:#666f97; --faint:#9aa2c7;
    --accent:#e08a00; --accent2:#3d5fdb; --good:#0f9d67; --bad:#d43e56;
    --line:#dde1f2; --line2:#c7cded; --fr:#3d5fdb; --fr2:#7451d6; --rose:#d94577; --teal:#0e9e91;
    --sh:0 4px 16px rgba(30,40,90,.09); --sh-lg:0 12px 34px rgba(30,40,90,.14);
  }
  :root[data-theme="light"] body{background:
      radial-gradient(1200px 600px at 80% -10%,rgba(61,95,219,.06),transparent 60%),
      radial-gradient(900px 500px at 0% 0%,rgba(116,81,214,.05),transparent 55%),var(--bg)}
  :root[data-theme="light"] .appbar{background:linear-gradient(180deg,#ffffff,#f7f8fd)}
  :root[data-theme="light"] .say{background:var(--card3);color:var(--fr)}
  :root[data-theme="light"] .quizopt{background:var(--card2)}
  :root[data-theme="light"] .scrtile{color:#2a2110}
  :root[data-theme="light"] .smcell{background:#eef0f9;color:var(--muted);border-color:var(--line2)}
  :root[data-theme="light"] .keycap{color:#2a2110}
  #themeToggle{background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-radius:999px;
    padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none}
  #themeToggle:hover{border-color:var(--fr)}
  #themeToggle .ic{width:15px;height:15px}
  .appbar .rightbtns{display:flex;align-items:center;gap:8px;flex:none}
  @media(max-width:480px){#themeToggle{padding:6px 9px;font-size:11px}}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:20;background:rgba(15,18,32,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 16px}
  .htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  h1 small{color:var(--muted);font-weight:400;font-size:13px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);
    padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px}
  nav button.active{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}
  main{max-width:940px;margin:0 auto;padding:18px 16px 90px}
  .tab{display:none;position:relative}
  .tab.active{display:block;animation:f .2s}
  @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  .card h2{margin:0 0 6px;font-size:17px}
  .card h3{margin:14px 0 6px;font-size:15px;color:var(--accent)}
  .muted{color:var(--muted)}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    padding:2px 8px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0}
  .fr{color:var(--ink);font-weight:600}
  .en{color:var(--muted);font-size:13px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .txt{flex:1;min-width:0}
  .say{flex:none;background:var(--fr);color:#fff;border:none;border-radius:9px;
    width:38px;height:38px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .say:active{transform:scale(.92)}
  .q{font-weight:600}.a{color:var(--good)}
  button.btn{background:var(--accent);color:#1a1300;border:none;border-radius:10px;padding:10px 16px;
    font-weight:700;cursor:pointer;font-size:14px}
  button.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  input,select,textarea{background:var(--card2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:9px 10px;font-size:14px;width:100%;font-family:inherit}
  label.fld{display:block;margin:10px 0}
  label.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .tag{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700}
  details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card2)}
  summary{cursor:pointer;font-weight:600}
  .lesson summary{font-size:15px}
  .scriptline{padding:8px 0;border-bottom:1px dashed var(--line)}
  .fc{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:var(--card2);border-radius:14px;padding:24px;cursor:pointer}
  .fc .big{font-size:26px;font-weight:700}
  .quizopt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
    color:var(--ink);padding:11px;border-radius:10px;margin:6px 0;cursor:pointer;font-size:15px}
  .quizopt.correct{background:rgba(61,220,151,.18);border-color:var(--good)}
  .quizopt.wrong{background:rgba(255,107,107,.18);border-color:var(--bad)}
  .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}
  .bar>i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
  .voicebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
  kbd{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .ok{color:var(--good)}.warn{color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{border:1px solid var(--line);padding:7px 9px;text-align:left}
  th{background:var(--card2);color:var(--accent)}
  .clockface{display:block;margin:0 auto}
  .donebtn{font-size:12px;padding:5px 10px}
  .anat{margin:4px 0 8px;border:1px solid var(--line);background:#141a2e;border-radius:10px}
  .anat summary{color:var(--fr);font-size:12px;font-weight:700}
  .anattbl{margin:8px 0}
  .anattbl td{border:0;border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top;font-size:13px}
  .anattbl tr:last-child td{border-bottom:0}
  .anattbl .w{white-space:nowrap}
  .say.mini{width:22px;height:22px;font-size:10px;display:inline-flex;vertical-align:middle;margin-left:4px}
  .anatrow{font-size:13px;margin:6px 2px}
  .anatrow b{color:var(--accent)}
  .lit{color:var(--good)}
  #subnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  #subnav button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  #subnav button.active{background:var(--card2);color:var(--ink);border-color:var(--fr);font-weight:700}
  .illo{display:block;width:100%;max-width:320px;margin:2px auto 12px;background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line)}
  .banner{display:block;width:100%;border-radius:14px;margin:2px 0 12px;max-height:190px;object-fit:cover;border:1px solid var(--line)}
  .stage{margin:20px 4px 2px;color:var(--fr);font-size:12px;letter-spacing:.8px;text-transform:uppercase;font-weight:800}
  .stage:first-child{margin-top:4px}
  .catnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .catbtn{background:var(--card2);color:var(--muted);border:1px solid var(--line);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px}
  .catbtn.active{background:var(--fr);color:#fff;border-color:var(--fr);font-weight:700}
  #enToggle{position:fixed;top:10px;right:10px;z-index:60;background:var(--card2);color:var(--ink);
    border:1px solid var(--fr);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #enToggle.active{background:var(--fr);color:#fff}
  @media(max-width:480px){#enToggle{padding:6px 9px;font-size:11px}}

  /* ============ DESIGN SYSTEM v2 (overrides) ============ */
  body{background:radial-gradient(1200px 600px at 80% -10%,rgba(91,120,255,.10),transparent 60%),
       radial-gradient(900px 500px at 0% 0%,rgba(139,107,255,.08),transparent 55%),var(--bg);
       -webkit-font-smoothing:antialiased;letter-spacing:.1px}
  ::selection{background:rgba(91,120,255,.35)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px}
  header{background:linear-gradient(180deg,rgba(9,11,20,.92),rgba(9,11,20,.72));backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:12px 18px}
  .htop{gap:10px}
  h1{font-size:var(--f-lg);font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
  .brandbang{color:var(--accent)}
  h1 .brandmark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;
    justify-content:center;box-shadow:0 4px 14px rgba(91,120,255,.5);flex:none}
  h1 .brandmark svg{width:18px;height:18px;color:#fff}
  h1 small{font-size:var(--f-sm)}
  main{max-width:1000px;padding:22px 18px 110px}

  /* nav = bucket bar with icons */
  nav{gap:8px;margin-top:12px}
  nav button{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    color:var(--ink2);padding:9px 15px;border-radius:999px;font-size:var(--f-sm);font-weight:600;
    transition:all .18s var(--ease)}
  nav button .ic{width:16px;height:16px;opacity:.85}
  nav button:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
  nav button.active{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(91,120,255,.4)}
  nav button.active .ic{opacity:1}
  #subnav{gap:4px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;display:inline-flex}
  #subnav button{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--muted);
    padding:7px 13px;border-radius:9px;font-size:var(--f-sm);font-weight:600;transition:all .16s var(--ease)}
  #subnav button .ic{width:15px;height:15px}
  #subnav button:hover{color:var(--ink);background:rgba(255,255,255,.03)}
  #subnav button.active{background:var(--card3);color:var(--ink);border:0;box-shadow:inset 0 0 0 1px var(--line2)}
  @media(max-width:640px){#subnav{display:flex;flex-wrap:wrap}}

  /* cards */
  .card{background:linear-gradient(180deg,var(--card),rgba(20,26,44,.6));border:1px solid var(--line);
    border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
  .card h2{font-size:var(--f-xl);font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:9px;margin:0 0 8px}
  .card h3{font-size:var(--f-md);color:var(--accent2);font-weight:700;display:flex;align-items:center;gap:7px}
  .card h2 .ic,.card h3 .ic{color:var(--accent2)}
  .muted{color:var(--muted)}

  /* buttons */
  button.btn{background:var(--grad);color:#fff;border:0;border-radius:11px;padding:11px 17px;font-weight:700;
    font-size:var(--f-sm);display:inline-flex;align-items:center;gap:7px;box-shadow:0 4px 14px rgba(91,120,255,.35);
    transition:transform .14s var(--ease),box-shadow .14s var(--ease),filter .14s}
  button.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(91,120,255,.5);filter:brightness(1.05)}
  button.btn:active{transform:translateY(0)}
  button.btn .ic{width:16px;height:16px}
  button.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2);box-shadow:none}
  button.btn.ghost:hover{background:var(--card2);color:var(--ink);border-color:var(--fr);box-shadow:none}
  button.btn.donebtn{padding:7px 13px;font-size:var(--f-xs)}

  /* speaker / mic circular icon buttons */
  .say{background:var(--card3);color:var(--accent2);border:1px solid var(--line2);border-radius:10px;
    width:36px;height:36px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    transition:all .15s var(--ease)}
  .say:hover{background:var(--fr);color:#fff;border-color:var(--fr);transform:translateY(-1px)}
  .say .ic{width:17px;height:17px}
  .say.mini{width:24px;height:24px;border-radius:7px}.say.mini .ic{width:13px;height:13px}

  /* inline icon base */
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* rows / lines */
  .row{padding:11px 0;gap:12px}
  .fr{font-weight:700;font-size:var(--f-md)}
  .en{font-size:var(--f-sm)}
  .lineblk{border-radius:var(--r);transition:background .15s}
  .lineblk:hover{background:rgba(255,255,255,.02)}

  /* pills / tags / chips */
  .tag{color:var(--accent2)}
  .catbtn{background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:600;transition:all .16s var(--ease)}
  .catbtn:hover{color:var(--ink);border-color:var(--line2)}
  .catbtn.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(91,120,255,.35)}

  /* progress bar */
  .bar{height:9px;background:var(--card3);border-radius:99px}
  .bar>i{background:linear-gradient(90deg,var(--good),var(--teal));box-shadow:0 0 12px rgba(62,224,160,.5)}

  /* quiz options */
  .quizopt{background:var(--card2);border:1px solid var(--line);border-radius:12px;font-weight:600;transition:all .15s var(--ease)}
  .quizopt:hover:not(:disabled){border-color:var(--fr);background:var(--card3);transform:translateX(2px)}

  /* anatomy */
  .anat{background:linear-gradient(180deg,#111726,#0e1420);border:1px solid var(--line);border-radius:var(--r)}
  .anat summary{color:var(--accent2);display:flex;align-items:center;gap:6px}
  .lit{color:var(--good)}

  /* flashcards */
  .fc{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:var(--r-lg);
    box-shadow:var(--sh)}
  .fc .big{font-size:var(--f-2xl);letter-spacing:-.5px}

  /* section illustration / banner */
  .illo{border-radius:var(--r-lg);box-shadow:var(--sh)}
  .banner{border-radius:var(--r-lg)}
  .stage{color:var(--accent2);font-weight:800;display:flex;align-items:center;gap:8px;font-size:var(--f-xs)}
  .stage .ic{width:15px;height:15px}
  .stage:before{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent);order:2}

  /* voicebar refined */
  .voicebar{color:var(--muted)}
  .voicebar select,.voicebar input[type=range]{background:var(--card2);border-color:var(--line)}

  /* ============ FONDATIONS module ============ */
  .fond-hero{background:var(--grad);border-radius:var(--r-xl);padding:22px 22px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
  .fond-hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
  .fond-hero h2{color:#fff;font-size:var(--f-2xl);margin:0 0 6px}
  .fond-hero p{color:rgba(255,255,255,.9);margin:0;max-width:640px;font-size:var(--f-md)}
  .fond-toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:6px}
  .toc-card{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;
    display:flex;gap:11px;align-items:center;transition:all .16s var(--ease)}
  .toc-card:hover{border-color:var(--fr);transform:translateY(-2px);box-shadow:var(--sh)}
  .toc-ic{width:38px;height:38px;border-radius:11px;background:var(--card3);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent2)}
  .toc-ic .ic{width:20px;height:20px}
  .toc-card b{font-size:var(--f-sm);display:block}.toc-card span{font-size:var(--f-xs);color:var(--muted)}

  .alpha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:6px}
  .alpha-cell{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:11px 8px;text-align:center;
    cursor:pointer;transition:all .15s var(--ease)}
  .alpha-cell:hover{border-color:var(--fr);background:var(--card3);transform:translateY(-2px)}
  .alpha-cell .L{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .alpha-cell .nm{font-size:var(--f-xs);color:var(--accent2);font-weight:700;margin-top:2px}
  .alpha-cell .ex{font-size:10px;color:var(--muted);margin-top:2px}

  .keycap{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;
    background:var(--card3);border:1px solid var(--line2);border-bottom-width:3px;border-radius:9px;font-size:20px;font-weight:800}
  .phon{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--fr);border-radius:var(--r);padding:13px 15px;margin:9px 0}
  .phon .sym{font-size:var(--f-xl);font-weight:800;color:var(--accent2)}
  .phon .snd{color:var(--muted);font-size:var(--f-sm)}
  .mp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
  .mp:last-child{border:0}
  .mp .w{font-weight:800;font-size:var(--f-md)}.mp .vs{color:var(--faint);font-weight:800}
  .mp .gl{color:var(--muted);font-size:var(--f-sm)}
  .accent-card{display:flex;gap:13px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:9px 0}
  .accent-card .big{font-size:34px;font-weight:800;line-height:1;color:var(--accent);flex:none;width:46px;text-align:center}
  .callout{background:linear-gradient(180deg,rgba(122,162,255,.1),rgba(122,162,255,.03));border:1px solid rgba(122,162,255,.3);
    border-radius:var(--r);padding:12px 14px;margin:10px 0;font-size:var(--f-sm);display:flex;gap:9px}
  .callout.warn{background:linear-gradient(180deg,rgba(255,194,75,.1),transparent);border-color:rgba(255,194,75,.3)}
  .callout .ic{color:var(--accent2);flex:none;margin-top:1px}
  .callout.warn .ic{color:var(--accent)}
  .fond-nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}

  /* ============ v3: CENTERED NAV HIERARCHY + A11Y (design-review pass) ============ */
  html{color-scheme:dark}
  /* center the whole app chrome */
  header{text-align:center}
  .htop{justify-content:center;flex-direction:column;gap:2px}
  header>.htop,header>nav,header>#subnav,header>.voicebar,header>#voiceStatus{max-width:1000px;margin-left:auto;margin-right:auto}
  nav{justify-content:center}
  .voicebar{justify-content:center}
  #voiceStatus{justify-content:center;text-align:center}
  /* TIER 1 — primary buckets: bigger, prominent, centered */
  nav{gap:9px;margin-top:14px}
  nav button{font-size:var(--f-md);padding:10px 18px;min-height:44px}

<script>
/* ==================== SUPABASE AUTH + CLOUD SYNC ==================== */
var SUPA_URL='https://arpfnqisuiqasjrjdelr.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFycGZucWlzdWlxYXNqcmpkZWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTEzNDIsImV4cCI6MjEwMDQ2NzM0Mn0.p_2bxR-LjPvO2yiEIarr_3MVyf_wzyfKlGEd4Zt8aUo';
var SB=null,SB_USER=null,SB_TOKEN=null,_syncTimer=null;
try{SB=window.supabase.createClient(SUPA_URL,SUPA_KEY);}catch(e){console.warn('Supabase init failed',e);}
var authMode='login';
function authFlip(){
  authMode=authMode==='login'?'signup':'login';
  document.getElementById('authSubmit').textContent=authMode==='login'?'Se connecter':'Créer un compte';
  document.getElementById('authToggle').innerHTML=authMode==='login'
    ?'Pas de compte ? <a onclick="authFlip()">Créer un compte</a>'
    :'Déjà un compte ? <a onclick="authFlip()">Se connecter</a>';
  document.getElementById('authErr').textContent='';
}
async function authDo(){
  var email=document.getElementById('authEmail').value.trim();
  var pass=document.getElementById('authPass').value;
  var errEl=document.getElementById('authErr');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='Email et mot de passe requis.';return;}
  try{
    var res;
    if(authMode==='signup'){
      res=await SB.auth.signUp({email:email,password:pass});
      if(res.error)throw res.error;
      errEl.className='auth-ok';errEl.textContent='Compte créé ! Vérifiez votre email si demandé.';
    }else{
      res=await SB.auth.signInWithPassword({email:email,password:pass});
      if(res.error)throw res.error;
    }
    SB_USER=res.data.user||(res.data.session?res.data.session.user:null);
    SB_TOKEN=res.data.session?res.data.session.access_token:null;
    document.getElementById('authOverlay').style.display='none';
    await cloudLoad();
    renderUserBar();
  }catch(e){errEl.className='auth-err';errEl.textContent=e.message||'Erreur inconnue.';}
}
function authSkip(){document.getElementById('authOverlay').style.display='none';SB_USER=null;renderUserBar();}
function renderUserBar(){
  var bar=document.getElementById('userBar');
  if(!bar){bar=document.createElement('div');bar.id='userBar';bar.className='user-bar';
    document.querySelector('.rightbtns').prepend(bar);}
  if(SB_USER){bar.innerHTML='<span>'+SB_USER.email+'</span><button onclick="authLogout()">Déconnexion</button>';}
  else{bar.innerHTML='<button onclick="showAuth()">Connexion</button>';}
}
function showAuth(){document.getElementById('authOverlay').style.display='flex';}
async function authLogout(){if(SB)await SB.auth.signOut();SB_USER=null;SB_TOKEN=null;renderUserBar();}
function deepMerge(local,cloud){
  var m={};var k;for(k in cloud)m[k]=cloud[k];for(k in local)m[k]=local[k];
  if(cloud.days||local.days){m.days={};for(k in cloud.days)m.days[k]=cloud.days[k];for(k in local.days)m.days[k]=Math.max(m.days[k]||0,local.days[k]);}
  if(cloud.lessons||local.lessons){m.lessons={};for(k in cloud.lessons)m.lessons[k]=cloud.lessons[k];for(k in local.lessons)m.lessons[k]=m.lessons[k]||local.lessons[k];}
  if(cloud.mine||local.mine){var s=new Set((cloud.mine||[]).concat(local.mine||[]));m.mine=Array.from(s);}
  if(cloud.weak||local.weak){var seen=new Set();m.weak=[];(local.weak||[]).concat(cloud.weak||[]).forEach(function(w){if(w.model&&!seen.has(w.model)){seen.add(w.model);m.weak.push(w);}});}
  ['fcSeen','chunkReps','quizBest','scrBest','smaxBest','missionStreak'].forEach(function(k){if(cloud[k]!=null||local[k]!=null)m[k]=Math.max(cloud[k]||0,local[k]||0);});
  if(cloud.scenes||local.scenes){m.scenes={};for(k in cloud.scenes)m.scenes[k]=cloud.scenes[k];for(k in local.scenes)m.scenes[k]=Math.max(m.scenes[k]||0,local.scenes[k]);}
  if(cloud.bb||local.bb){m.bb={};for(k in cloud.bb)m.bb[k]=cloud.bb[k];for(k in local.bb)m.bb[k]=m.bb[k]||local.bb[k];}
  if(cloud.missWords||local.missWords){m.missWords={};for(k in cloud.missWords)m.missWords[k]=cloud.missWords[k];for(k in local.missWords)m.missWords[k]=Math.max(m.missWords[k]||0,local.missWords[k]);}
  if(cloud.readDone||local.readDone){m.readDone={};for(k in cloud.readDone)m.readDone[k]=true;for(k in local.readDone)m.readDone[k]=true;}
  if(cloud.writeDrafts||local.writeDrafts){m.writeDrafts={};for(k in cloud.writeDrafts)m.writeDrafts[k]=cloud.writeDrafts[k];for(k in local.writeDrafts)m.writeDrafts[k]=local.writeDrafts[k];}
  if(cloud.mineDates||local.mineDates){m.mineDates={};for(k in cloud.mineDates)m.mineDates[k]=cloud.mineDates[k];for(k in local.mineDates){if(!m.mineDates[k]||local.mineDates[k]>m.mineDates[k])m.mineDates[k]=local.mineDates[k];}}
  return m;
}
async function cloudLoad(){
  if(!SB||!SB_USER)return;
  try{
    var r=await SB.from('progress').select('prog,profile,updated_at').eq('id',SB_USER.id).single();
    if(r.data&&r.data.prog){var merged=deepMerge(PROG,r.data.prog);for(var k in merged)PROG[k]=merged[k];localStorage.setItem('frprog',JSON.stringify(PROG));}
    if(r.data&&r.data.profile){var cp=r.data.profile;for(var k2 in cp){if(cp[k2]!=null)P[k2]=cp[k2];}localStorage.setItem('frprofile',JSON.stringify(P));}
    var r2=await SB.from('profiles').select('gemini_key,gemini_model,voice_name,rec_lang,theme,en_mode').eq('id',SB_USER.id).single();
    if(r2.data){var p=r2.data;if(p.gemini_key)localStorage.setItem('frgemkey',p.gemini_key);if(p.gemini_model)localStorage.setItem('frgemmodel',p.gemini_model);if(p.voice_name)localStorage.setItem('frvoice',p.voice_name);if(p.rec_lang)localStorage.setItem('frrec',p.rec_lang);if(p.theme!=null)localStorage.setItem('frtheme',p.theme);if(p.en_mode!=null)localStorage.setItem('fren',p.en_mode?'1':'0');}
    var r3=await SB.from('sessions').select('module,state').eq('user_id',SB_USER.id);
    if(r3.data)r3.data.forEach(function(s){if(!localStorage.getItem('frsess_'+s.module))localStorage.setItem('frsess_'+s.module,JSON.stringify(s.state));});
    rehydrate();
  }catch(e){console.warn('cloudLoad error',e);}
}
function rehydrate(){
  var ss=loadSession('scrmini');
  if(ss&&ss.scrTiles&&ss.scrTiles.length){scrTiles=ss.scrTiles;scrPick=ss.scrPick||[];scrScore=ss.scrScore||0;scrFound=ss.scrFound||[];}
  var sx=loadSession('smax');
  if(sx&&sx.grid&&sx.grid.length){SMAX.grid=sx.grid;SMAX.rack=sx.rack||[];SMAX.placed=sx.placed||[];SMAX.score=sx.score||0;SMAX.turn=sx.turn||1;SMAX.vs=sx.vs||'solo';SMAX.aiRack=sx.aiRack||[];SMAX.aiScore=sx.aiScore||0;SMAX.lastAI=sx.lastAI||[];SMAX.aiWords=sx.aiWords||[];SMAX.sel=null;SMAX.msg='';SMAX.sosNote='';}
  var sq=loadSession('quiz');
  if(sq&&sq.qorder&&sq.qorder.length&&sq.qi<sq.qorder.length){qi=sq.qi;qscore=sq.qscore;qorder=sq.qorder;}
  var sb=loadSession('bb');
  if(sb&&sb.bbTray){bbI=sb.bbI||0;bbTray=sb.bbTray;bbBank=sb.bbBank||[];bbDone=sb.bbDone||false;}
  try{renderStart();}catch(e){}
  try{if(typeof gamesRender==='function')gamesRender();}catch(e){}
  try{if(typeof aiPaint==='function'&&aiKey())aiPaint();}catch(e){}
}
function cloudSync(){if(!SB||!SB_USER)return;clearTimeout(_syncTimer);_syncTimer=setTimeout(async function(){try{await SB.from('progress').upsert({id:SB_USER.id,prog:PROG,profile:P,updated_at:new Date().toISOString()},{onConflict:'id'});}catch(e){console.warn('cloudSync error',e);}},2000);}
async function cloudSyncPrefs(){if(!SB||!SB_USER)return;try{await SB.from('profiles').upsert({id:SB_USER.id,voice_name:localStorage.getItem('frvoice')||null,rec_lang:localStorage.getItem('frrec')||'fr-FR',theme:localStorage.getItem('frtheme')||'dark',en_mode:localStorage.getItem('fren')==='1'},{onConflict:'id'});}catch(e){console.warn('cloudSyncPrefs error',e);}}
async function cloudSyncSession(mod){if(!SB||!SB_USER)return;try{var raw=localStorage.getItem('frsess_'+mod);if(raw){await SB.from('sessions').upsert({user_id:SB_USER.id,module:mod,state:JSON.parse(raw),updated_at:new Date().toISOString()},{onConflict:'user_id,module'});}else{await SB.from('sessions').delete().eq('user_id',SB_USER.id).eq('module',mod);}}catch(e){console.warn('cloudSyncSession error',e);}}
async function initAuth(){if(!SB)return;try{var r=await SB.auth.getSession();if(r.data.session&&r.data.session.user){SB_USER=r.data.session.user;SB_TOKEN=r.data.session.access_token||null;await cloudLoad();renderUserBar();return;}}catch(e){console.warn('initAuth error',e);}document.getElementById('authOverlay').style.display='flex';}

/* ==================== SPEECH ==================== */
let voices=[], voicesBuilt=false;
const isFrench=v=>/^fr|french|français|france/i.test((v.lang||'')+(v.name||''));
function bestFrench(){
  const fr=voices.filter(isFrench);
  return fr.find(v=>/fr-FR/i.test(v.lang)&&/google/i.test(v.name))
      || fr.find(v=>/fr-FR/i.test(v.lang))
      || fr.find(v=>/google/i.test(v.name)) || fr[0] || voices[0] || null;
}
function currentVoice(){
  const sel=document.getElementById('voiceSel');
  if(sel && sel.value!=='' && voices[+sel.value]) return voices[+sel.value];
  const saved=localStorage.getItem('frvoice');
  if(saved){const v=voices.find(x=>x.name===saved); if(v)return v;}
  return bestFrench();
}
function loadVoices(force){
  if(!('speechSynthesis' in window)){const s=document.getElementById('voiceStatus');if(s){s.innerHTML='❌ No speech support. Open in <b>Google Chrome</b>.';s.style.color='var(--bad)';}return;}
  voices=speechSynthesis.getVoices()||[];
  const fr=voices.filter(isFrench);
  const sel=document.getElementById('voiceSel'), status=document.getElementById('voiceStatus');
  if(voices.length && sel && (!voicesBuilt||force)){
    const list=fr.length?fr:voices;
    sel.innerHTML='';
    list.forEach(v=>{const o=document.createElement('option');o.value=voices.indexOf(v);
      o.textContent=(isFrench(v)?'🇫🇷 ':'')+v.name+' ('+v.lang+')';sel.appendChild(o);});
    const saved=localStorage.getItem('frvoice');
    let want=(saved&&list.find(v=>v.name===saved))||bestFrench();
    if(want)sel.value=voices.indexOf(want);
    sel.onchange=()=>{const v=voices[+sel.value];if(v)localStorage.setItem('frvoice',v.name);say('Bonjour, je suis votre nouvelle voix.');};
    voicesBuilt=true;
  }
  const rl=document.getElementById('recLang');
  if(rl&&!rl.dataset.init){rl.value=localStorage.getItem('frrec')||'fr-FR';rl.dataset.init=1;rl.onchange=()=>localStorage.setItem('frrec',rl.value);}
  if(status){const cur=currentVoice();
    if(fr.length){status.innerHTML='✅ French voice ready: <b>'+(cur?cur.name:'?')+'</b> ('+(cur?cur.lang:'')+'). Pick another if unclear — it changes instantly.';status.style.color='var(--good)';}
    else if(voices.length){status.innerHTML='⚠︎ No French voice installed — using <b>'+(cur?cur.name:'?')+'</b>. Best fix: use <b>Google Chrome</b> (built-in “Google français”). On Mac: System Settings → Accessibility → Spoken Content → System Voice → Manage Voices → add <b>French</b>, then “↻ Reload”.';status.style.color='var(--accent)';}
    else{status.innerHTML='⏳ Loading voices… click “↻ Reload”, or open in <b>Google Chrome</b>.';status.style.color='var(--accent)';}
  }
}
function recLang(){return (document.getElementById('recLang')||{}).value||localStorage.getItem('frrec')||'fr-FR';}
speechSynthesis.onvoiceschanged=()=>loadVoices();
loadVoices(); [200,600,1200,2500].forEach(t=>setTimeout(()=>loadVoices(),t));
function say(t,opts){
  if(!t)return;
  if(!('speechSynthesis' in window)){alert('No speech support — please use Google Chrome.');return;}
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(String(t).replace(/\[[^\]]*\]/g,''));
  const v=currentVoice(); if(v){u.voice=v;u.lang=v.lang;}else{u.lang='fr-FR';}
  u.rate=(opts&&opts.rate)||parseFloat((document.getElementById('rate')||{}).value)||0.92;
  if(opts&&opts.onend)u.onend=opts.onend;
  u.onerror=e=>{const s=document.getElementById('voiceStatus');if(s){s.innerHTML='❌ Playback error ('+(e.error||'?')+'). Try “↻ Reload” or Google Chrome.';s.style.color='var(--bad)';}};
  setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){}},60);
}
/* ---- real SVG icons (feather-style sprite defined in <body>) ---- */
function icon(name,cls){return `<svg class="ic${cls?' '+cls:''}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;}
const SPK=icon('volume'), MIC=icon('mic');   // most-used button glyphs
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sattr(t){return escAttr(JSON.stringify(t));}
function line(fr,en){return `<div class="lineblk"><div class="row"><div class="txt"><div class="fr">${esc(fr)}</div>${en?`<div class="en">${esc(en)}</div>`:''}</div>
  <button class="say" aria-label="Écouter" onclick="say(${sattr(fr)})" title="Écouter">${SPK}</button></div>${anat(fr)}</div>`;}
/* ---- SENTENCE ANATOMY: what each piece does + how it differs from English ---- */
function anatGet(fr){if(ANAT[fr])return ANAT[fr];const k=String(fr).replace(/\s*[.!?]+\s*$/,'').trim();return ANAT[k]||null;}
function hasAnat(fr){return !!anatGet(fr);}
function anat(fr,openIt){
  const a=anatGet(fr); if(!a)return '';
  const rows=a.p.map(([w,l,j])=>`<tr><td class="w"><b>${esc(w)}</b><button class="say mini" aria-label="Écouter" onclick="say(${sattr(w)})">${SPK}</button></td><td class="lit">${esc(l)}</td><td class="muted">${esc(j)}</td></tr>`).join('');
  return `<details class="anat" ${openIt?'open':''}><summary>${icon('scan')} Anatomie — how it's built</summary>
    <table class="anattbl">${rows}</table>
    <div class="anatrow"><b>Word-for-word:</b> <span class="lit">« ${esc(a.lit)} »</span></div>
    <div class="anatrow"><b>How it works:</b> ${esc(a.machine)}</div>
    <div class="anatrow"><b>vs English:</b> ${esc(a.diff)}</div>
    ${a.pattern?`<div class="anatrow"><b>Pattern to keep:</b> ${esc(a.pattern)}</div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="morebtn" onclick="askAI('Anatomie',${sattr('Donne-moi 6 AUTRES exemples qui suivent exactement le même schéma que « '+fr+' ». Pour chacun : le français, la traduction, et ce qui change. Termine par 2 phrases à trous pour que je m’entraîne.')})">${icon('layers')} Plus d’exemples comme ça</button>
      <button class="morebtn" onclick="askAI('Anatomie',${sattr('Montre-moi le CONTRAIRE / la variante opposée de « '+fr+' » : la forme négative, la question, et le pluriel si possible. Explique ce qui bouge dans la phrase à chaque fois.')})">${icon('repeat')} Et l’inverse ?</button>
      <button class="morebtn" onclick="askAI('Anatomie',${sattr('Je ne comprends toujours pas cette phrase : « '+fr+' ». Ré-explique-la autrement, encore plus simplement, avec une image mentale et une astuce pour la retenir.')})">${icon('brain')} Toujours pas clair ?</button>
    </div>
  </details>`;
}

function norm(s){return ' '+String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()+' ';}
function digitsCount(s){const w=(norm(s).match(/\b(zero|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix)\b/g)||[]).length;const d=(String(s).match(/\d/g)||[]).length;return w+d;}

function pget(k){return (P[k]!=null&&P[k]!=='')?P[k]:pdef[k];}
function psave(){localStorage.setItem('frprofile',JSON.stringify(P));renderConv();cloudSync();}
const PROG=JSON.parse(localStorage.getItem('frprog')||'{}');
if(!PROG.scenes)PROG.scenes={}; if(!PROG.weak)PROG.weak=[]; if(!PROG.lessons)PROG.lessons={};
function progSave(){var ts=new Date().toISOString();localStorage.setItem('frprog',JSON.stringify(PROG));localStorage.setItem('frprog_ts',ts);cloudSync();}
function saveSession(mod,state){localStorage.setItem('frsess_'+mod,JSON.stringify(state));cloudSyncSession(mod);}
function loadSession(mod){var d=localStorage.getItem('frsess_'+mod);return d?JSON.parse(d):null;}
function clearSession(mod){localStorage.removeItem('frsess_'+mod);cloudSyncSession(mod);}
function saveScene(n,p){PROG.scenes[n]=Math.max(PROG.scenes[n]||0,p);progSave();renderStart();}
function saveQuiz(p){PROG.quizBest=Math.max(PROG.quizBest||0,p);progSave();renderStart();}
function bumpFC(){PROG.fcSeen=(PROG.fcSeen||0)+1;progSave();}
function toggleLesson(id){PROG.lessons[id]=!PROG.lessons[id];progSave();renderLessons();renderStart();}
function addWeak(prompt,model){if(!model)return;if(PROG.weak.some(w=>w.model===model))return;PROG.weak.push({prompt:prompt||'',model});progSave();}
function clearWeak(m){PROG.weak=PROG.weak.filter(w=>w.model!==m);progSave();}
function lessonsDonePct(){const t=LESSONS.length;const d=LESSONS.filter(l=>PROG.lessons[l.id]).length;return t?Math.round(d/t*100):0;}
function chunksPct(){return Math.round(((PROG.mine||[]).length/CHUNKS.length)*100);}
function overallPct(){const parts=[lessonsDonePct(),chunksPct()];const sv=Object.values(PROG.scenes);if(sv.length)parts.push(sv.reduce((a,b)=>a+b,0)/sv.length);if(PROG.quizBest!=null)parts.push(PROG.quizBest);return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);}
function renderStart(){const el=document.querySelector('[data-tab="Départ"]');if(el&&el.dataset.loaded)el.innerHTML=TABS['Départ']();}

/* ==================== CONVERSATION ENGINE ==================== */
function sayThen(text,cb){
  if(!('speechSynthesis' in window)){cb&&cb();return;}
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(String(text).replace(/\[[^\]]*\]/g,''));
  const v=currentVoice();if(v){u.voice=v;u.lang=v.lang;}else{u.lang='fr-FR';}
  u.rate=parseFloat((document.getElementById('rate')||{}).value)||0.92;
  let done=false;const go=()=>{if(done)return;done=true;cb&&cb();};
  u.onend=go;u.onerror=go;setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){go();}},60);setTimeout(go,9000);
}

function evalAnswer(step,text){const t=' '+norm(text)+' ';const words=norm(text).split(' ').filter(Boolean);const issues=[];

  if(step.need)step.need.forEach(rx=>{if(!rx.test(t))issues.push('missing <b>“'+rx.source.replace(/\\b/g,'')+'”</b>');});

TABS['Vocabulaire']=()=>`<div class="card"><h2>${icon('grid')} Vocabulaire</h2>
  <p class="muted">Pick a set, tap the card to flip, 🔊 reads the French.</p>
  <select id="vocset" onchange="initFC()" style="max-width:280px">${Object.keys(VOC).map(k=>`<option>${k}</option>`).join('')}</select>
  <div id="fcwrap" style="margin-top:12px"></div>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn ghost" onclick="fcPrev()">‹</button><button class="btn" onclick="fcFlip()">Retourner</button><button class="btn ghost" onclick="fcNext()">›</button><button class="btn ghost" onclick="fcShuffle()">🔀</button></div>
  <div id="fccount" class="muted" style="margin-top:8px"></div></div>`;
let fcArr=[],fcI=0,fcFlipped=false;
function initFC(){fcArr=VOC[document.getElementById('vocset').value].slice();fcI=0;fcFlipped=false;drawFC();}
function drawFC(){const w=document.getElementById('fcwrap');if(!w)return;const c=fcArr[fcI];
  const img=c[2]?`<img src="${c[2]}" alt="" style="width:150px;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:'';
  w.innerHTML=`<div class="fc" onclick="fcFlip()">${img}<div class="big">${esc(fcFlipped?c[1]:c[0])}</div><div class="muted" style="margin-top:8px">${fcFlipped?'🇬🇧 English — tap to flip':'🇫🇷 Français — tap to flip'}</div><button class="say" aria-label="Écouter" style="margin-top:12px" onclick="event.stopPropagation();sayCard()">${SPK}</button></div>`;
  document.getElementById('fccount').textContent=`Carte ${fcI+1} / ${fcArr.length}`;if(EN)applyEN(w.parentElement||w);}
function sayCard(){say(fcArr[fcI][0]);}
function fcFlip(){fcFlipped=!fcFlipped;drawFC();}
function fcNext(){fcI=(fcI+1)%fcArr.length;fcFlipped=false;drawFC();bumpFC();}
function fcPrev(){fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlipped=false;drawFC();}
function fcShuffle(){for(let i=fcArr.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[fcArr[i],fcArr[j]]=[fcArr[j],fcArr[i]];}fcI=0;fcFlipped=false;drawFC();}

/* ==================== FONDATIONS (the ground floor) ==================== */
function spk(t){return `<button class="say" aria-label="Écouter" onclick="say(${sattr(t)})" title="Écouter">${SPK}</button>`;}
/* clickable word chip that speaks itself */
function wc(w,gl){return `<button class="quizopt" style="width:auto;display:inline-flex;align-items:center;gap:8px;margin:4px;padding:9px 13px" onclick="say(${sattr(w)})"><b>${esc(w)}</b>${gl?`<span class="muted" style="font-size:12px">${esc(gl)}</span>`:''}<span style="color:var(--accent2)">${icon('volume')}</span></button>`;}
/* safe 'word (gloss)' list renderer — tolerates entries with no gloss e.g. 'Paris' */
function exs(list){return list.map(x=>{const m=String(x).match(/^(.*?)\s*\((.*)\)\s*$/);return m?wc(m[1].trim(),m[2].trim()):wc(String(x).trim(),'');}).join('');}
function fhero(ic,title,sub){return `<div class="fond-hero"><h2>${icon(ic)} ${esc(title)}</h2><p>${sub}</p></div>`;}
function callout(txt,warn){return `<div class="callout${warn?' warn':''}">${icon(warn?'zap':'bulb')}<div>${txt}</div></div>`;}

TABS['Accents']=()=>`
 ${fhero('flag','Les accents & caractères spéciaux','French has 5 accent marks and 2 special characters. They are <b>not decoration</b> — they change the <b>sound</b>, and sometimes the whole <b>meaning</b> of a word. This is the piece most self-learners skip and regret.')}
 ${[
   ['é','L’accent aigu','Only ever sits on <b>e</b>. It makes a crisp, closed <b>“ay”</b> sound. The single most common accent in French.',[['café','coffee'],['été','summer'],['éléphant','elephant'],['télé','TV'],['marché','market'],['réservé','reserved']]],
   ['è','L’accent grave','On <b>e</b> it opens the sound to <b>“eh”</b> (mouth wider than é). On <b>a</b> and <b>u</b> it does NOT change the sound — it separates look-alike words (see the pairs below).',[['mère','mother'],['père','father'],['très','very'],['règle','rule'],['problème','problem'],['où','where']]],
   ['ê','L’accent circonflexe','Often a <b>ghost “s”</b>: a Latin/old-French s that vanished. Spot the hidden English cousin — for<b>ê</b>t = fore<b>s</b>t, hô<b>p</b>ital, î<b>l</b>e = i<b>s</b>le. On e it sounds like è.',[['forêt','forest (forest)'],['hôpital','hospital'],['île','island (isle)'],['être','to be'],['pâte','paste/dough'],['fête','party (feast)']]],
   ['ç','La cédille','A little tail under <b>c</b> that forces the soft <b>“s”</b> sound before a, o, u. Without it, c before a/o/u would be a hard <b>“k”</b>.',[['ça','that'],['français','French'],['garçon','boy/waiter'],['leçon','lesson'],['reçu','receipt'],['façade','façade']]],

   ['œ','La ligature « o-e-collés »','o and e fused into one letter, almost always in <b>œu</b>. Say a rounded “euh”.',[['sœur','sister'],['cœur','heart'],['œuf','egg'],['bœuf','beef/ox'],['œil','eye'],['vœu','wish']]]

 <div class="card"><h3>${icon('scan')} Un accent peut CHANGER LE SENS</h3>

function phon(sym,snd,body){return `<div class="phon"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="sym">${esc(sym)}</span><span class="snd">${snd}</span></div><div style="margin-top:8px">${body}</div></div>`;}
const SONSECT=[
 {t:'Voyelles',ic:'type',render:()=>`
   <p class="muted">French vowels are pure and short — no gliding like English. And several <b>letter teams</b> make one sound.</p>
   ${phon('é / è / e','the three E’s','é = closed “ay” (café) · è/ê = open “eh” (mère) · e with no accent is often a soft “uh” or silent at the end.',)}
   ${phon('ou','“oo” as in food','deep, rounded. '+exs(['nous (we)','vous (you)','rouge (red)','beaucoup (a lot)']))}
   ${phon('u','“ew” — no English equal','round your lips to say “oo”, then say “ee”. That’s the French u. Very different from ou! '+exs(['tu (you)','lune (moon)','sur (on)','rue (street)']))}
   ${callout('<b>u vs ou</b> is the classic English-speaker trap. « tu » (you) vs « tout » (all); « rue » (street) vs « roue » (wheel). '+spk('tu … tout … rue … roue'))}
   ${phon('oi','“wa”','moi = “mwa”. '+exs(['moi (me)','trois (three)','boire (to drink)','voiture (car)']))}
   ${phon('au / eau','“oh”','beau = “boh”. '+exs(['beau (handsome)','eau (water)','aussi (also)','chaud (hot)']))}
   ${phon('ai / ei','“eh” (like è)','mais = “meh”. '+exs(['mais (but)','lait (milk)','neige (snow)','treize (13)']))}
   ${phon('eu / œu','rounded “uh”','deux = “duh” (rounded). '+exs(['deux (two)','peur (fear)','sœur (sister)','feu (fire)']))}
   ${phon('-ille','“ee-y”','fille = “fee-y”. '+exs(['fille (girl)','famille (family)','travailler (to work)'])+'  <span class="muted">Exceptions: ville, mille, tranquille say a real “l”.</span>')}
 `},
 {t:'Voyelles nasales',ic:'cloud',render:()=>`
   <p class="muted">A vowel + <b>n</b> or <b>m</b> at the end of a syllable becomes <b>nasal</b> — the air goes through your nose and the n/m itself is <b>not</b> pronounced. There are 4 nasal sounds:</p>
   ${phon('an / am / en / em','nasal “on/ahn”',exs(['dans (in)','temps (time)','enfant (child)','ensemble (together)']))}
   ${phon('on / om','nasal “ohn”',exs(['bon (good)','nom (name)','maison (house)','tomber (to fall)']))}
   ${phon('in / im / ain / ein / yn','nasal “an” (bright)',exs(['vin (wine)','pain (bread)','plein (full)','sympa (nice)']))}
   ${phon('un / um','nasal “uh”',exs(['un (one/a)','brun (brown)','parfum (perfume)','lundi (Monday)']))}
   ${callout('<b>The key rule:</b> it’s only nasal when the n/m ENDS the syllable. If a vowel follows, or the n/m is doubled, it’s NOT nasal — you pronounce the n. Compare: <b>bon</b> (nasal) vs <b>bonne</b> (“bon” with a clear n); <b>an</b> vs <b>année</b>; <b>vin</b> vs <b>vinaigre</b>. '+spk('bon … bonne … an … année'),true)}
 `},
 {t:'Consonnes',ic:'waveform',render:()=>`
   <p class="muted">Most consonants behave — here are the ones that trip people up.</p>
   ${phon('c','“k” or “s”','Hard <b>“k”</b> before a, o, u (café, comme). Soft <b>“s”</b> before e, i, y (ce, ici). Add a cédille (ç) to force “s” before a/o/u.')}
   ${phon('g','“g” or “zh”','Hard <b>“g”</b> before a, o, u (gâteau). Soft <b>“zh”</b> before e, i, y (girafe, genou). <b>gn</b> = “ny” (montagne, “moun-tan-yuh”).')}
   ${phon('s','“s” or “z”','“s” at the start or next to a consonant. A <b>single s between two vowels = “z”</b> (maison “may-zon”, rose). <b>ss</b> stays “s” (poisson).'+ '<div style="margin-top:6px">'+exs(['maison (house)','rose (pink)','poisson (fish)','désert (desert)'])+'</div>')}
   ${phon('ch','“sh”',exs(['chat (cat)','chocolat (chocolate)','chercher (to look for)']))}
   ${phon('j / g(e,i)','“zh” (soft)',exs(['je (I)','jour (day)','bonjour (hello)','girafe (giraffe)']))}
   ${phon('qu','just “k”',exs(['qui (who)','quatre (four)','pourquoi (why)','musique (music)']))}
   ${phon('r','from the throat','The famous French R — a soft gargle at the back of the throat, not the English tongue-r. '+exs(['rouge (red)','Paris','merci (thanks)','trois (three)']))}
   ${phon('h','always silent','French h is never pronounced. It only matters for liaison (next section). '+exs(['hôtel (hotel)','heure (hour)','homme (man)']))}
   ${phon('th / ph','“t” / “f”','th is just “t” (thé = “tay”); ph is “f” (photo). '+exs(['thé (tea)','photo','pharmacie (pharmacy)']))}
 `},
 {t:'Muettes & liaisons',ic:'link',render:()=>`
   <p class="muted">Why written French looks longer than it sounds: lots of letters are silent — until a <b>liaison</b> wakes them up.</p>

   ${phon('L’élision','the shrinking words','Before a vowel or silent h, these little words drop their vowel and take an apostrophe: le/la→l’, je→j’, ne→n’, de→d’, que→qu’, se→s’, ce→c’, me→m’, te→t’. '+['le ami → l’ami','je habite → j’habite','de eau → d’eau','ce est → c’est'].map(w=>`<div class="row" style="border:0;padding:4px 0"><div class="txt"><span class="fr">${esc(w)}</span></div>${spk(w.split(' → ')[1])}</div>`).join(''))}
   ${callout('<b>h muet vs h aspiré:</b> most h’s are “mute” and allow liaison/élision (l’homme, les_hommes). A few are “aspirated” and BLOCK it — you say « le héros », « la hache », « les | haricots » with no link. There’s no sound difference; it’s just memorised per word.',true)}
 `},
 {t:'Le rythme',ic:'waveform',render:()=>`
   <p class="muted">The last piece — and the one that instantly makes you sound French.</p>
   ${phon('L’accent tonique','stress the LAST syllable','English hammers a stressed syllable in every word (PHO-to-graph). French keeps every syllable even and light, then gives a gentle push to the <b>last</b> syllable of the whole group. pho-to-GRA-phie. '+spk('photographie'))}
   ${phon('Rythme régulier','even, syllable-timed','French syllables are like an even drumbeat — no “strong/weak” alternation. Count them out: Je-vou-drais-un-ca-FÉ. '+spk('Je voudrais un café'))}

 `}

 ['“the girls” (fem. plural):',['les filles','la filles','les fille'],0,'les + noun + s.'],
 ['Adjective agreement: une voiture ___',['bleue','bleu','bleus'],0,'voiture is feminine → add -e: bleue.'],
 ['Colour goes: une ___ voiture / une voiture ___ ?',['voiture rouge','rouge voiture','voiture rouges'],0,'Most adjectives go AFTER the noun: une voiture rouge.'],
 ['à + le = ___',['au','al','àle'],0,'à + le → au (au cinéma). Also à+les→aux.'],
 ['de + le = ___',['du','del','de le'],0,'de + le → du (du pain). Also de+les→des.'],
 ['“I go TO the restaurant”: Je vais ___ restaurant.',['au','à','du'],0,'à + le = au restaurant.'],
 ['Partitive “some water”: Je bois ___ eau.',['de l’','du','de la'],0,'Before a vowel, de la → de l’: de l’eau.'],
 ['Partitive “some bread”: Je mange ___ pain.',['du','de la','des'],0,'pain is masculine → du pain.'],
 ['“my” before feminine “mère”:',['ma','mon','mes'],0,'ma mère (ma before feminine).'],
 ['“your” (informal) before plural “amis”:',['tes','ton','ta'],0,'tes amis.'],
 ['“He is a teacher”:',['Il est professeur','Il est un professeur','C’est professeur'],0,'No article before a job: Il est professeur.'],
 ['“It’s a good idea”:',['C’est une bonne idée','Il est une bonne idée','C’est bonne idée'],0,'c’est + article + noun.'],
 ['Preposition: J’habite ___ France.',['en','à','au'],0,'en + feminine country: en France (but au Canada, aux États-Unis).'],

 ['Negative + partitive: Je ne mange pas ___ pain.',['de','du','le'],0,'After a negative, du/de la/des → de.'],

function gconj(title,rows){return `<div class="card" style="margin:8px 0;background:var(--card2)"><b class="warn">${esc(title)}</b><table style="margin-top:6px">${rows.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table></div>`;}
TABS['Grammaire']=()=>`
 ${fhero('book','La grammaire — les os du français','Built up in order, from the noun to the full sentence. Each block has the rule, real examples you can hear, and the trap English speakers fall into. When you feel ready, the quiz at the bottom checks all of it.')}

 <div class="stage">${icon('layers')} 1 · Le nom : genre &amp; articles</div>
 <div class="card"><h3>${icon('type')} Chaque nom est masculin ou féminin</h3>
   <p class="muted">There is no “it” — every noun is he or she, and its little word announces which. <b>Always learn a noun with its article.</b></p>
   <table><tr><th></th><th>Masculin</th><th>Féminin</th><th>Pluriel</th></tr>
     <tr><td><b>the</b> (definite)</td><td>le café</td><td>la table</td><td>les cafés</td></tr>
     <tr><td>before a vowel</td><td colspan="2">l’ami, l’eau</td><td>les amis</td></tr>
     <tr><td><b>a / some</b> (indefinite)</td><td>un café</td><td>une table</td><td>des cafés</td></tr>
     <tr><td><b>some</b> (partitive)</td><td>du pain</td><td>de la confiture</td><td>des fruits</td></tr>
   </table>
   ${['le café (the coffee)','une femme (a woman)','des enfants (some children)','du pain (some bread)','de l’eau (some water)'].map(w=>wc(w.split(' (')[0],w.match(/\((.*)\)/)[1])).join('')}
   ${callout('The <b>partitive</b> (du / de la / des = “some”) is unavoidable in French where English drops it: « je mange <b>du</b> pain » = “I eat bread”.')}
 </div>
 <div class="card"><h3>${icon('grid')} Le pluriel</h3>
   <p class="muted">Usually just add <b>-s</b> (silent!). The article does the audible work: le livre → <b>les</b> livres.</p>
   <table><tr><th>Rule</th><th>Example</th></tr>
     <tr><td>+ s (most)</td><td>un livre → des livres</td></tr>
     <tr><td>-s / -x / -z : no change</td><td>un bras → des bras</td></tr>
     <tr><td>-au / -eu → -x</td><td>un gâteau → des gâteaux</td></tr>
     <tr><td>-al → -aux</td><td>un animal → des animaux</td></tr>
   </table>
 </div>

 <div class="card"><h3>${icon('scan')} Deviner le genre — les terminaisons qui trahissent</h3>
   <p class="muted">You don’t have to memorise every noun’s gender. The <b>ending</b> predicts it ~80% of the time. Learn these two lists and you’ll guess right most of the time.</p>
   <div class="grid2">
     <div><div class="muted" style="font-weight:800;color:#ff8fa3;margin-bottom:6px">FÉMININ — presque toujours</div>
       <table><tr><th>-tion / -sion</th><td>la nation, la télévision</td></tr>
       <tr><th>-té / -tié</th><td>la liberté, la moitié</td></tr>
       <tr><th>-ette</th><td>la baguette, la fourchette</td></tr>
       <tr><th>-ure</th><td>la voiture, la nature</td></tr>
       <tr><th>-ence / -ance</th><td>la science, la chance</td></tr>
       <tr><th>-ie</th><td>la boulangerie, la vie</td></tr>
       <tr><th>-eur (abstrait)</th><td>la couleur, la peur</td></tr></table></div>
     <div><div class="muted" style="font-weight:800;color:#7aa2ff;margin-bottom:6px">MASCULIN — presque toujours</div>
       <table><tr><th>-ment</th><td>le moment, l’appartement</td></tr>
       <tr><th>-eau</th><td>le bateau, le gâteau</td></tr>
       <tr><th>-age</th><td>le fromage, le voyage</td></tr>
       <tr><th>-isme</th><td>le tourisme</td></tr>
       <tr><th>-in / -ain</th><td>le vin, le pain</td></tr>
       <tr><th>-oir</th><td>le soir, le miroir</td></tr>
       <tr><th>jours, mois, langues</th><td>le lundi, le français</td></tr></table></div>
   </div>
   ${callout('Traps: <b>la</b> page, <b>la</b> photo, <b>la</b> main, <b>le</b> problème, <b>le</b> musée, <b>le</b> lycée (‑ée is usually feminine — musée/lycée are the exceptions), <b>l’</b>eau (f).',true)}
   <h3 style="margin-top:16px">${icon('grid')} Entraîne-toi : le ou la ?</h3>
   <div class="chips">${[['fromage','le'],['nation','la'],['gâteau','le'],['voiture','la'],['moment','le'],['baguette','la'],['voyage','le'],['liberté','la'],['pain','le'],['boulangerie','la'],['problème','le'],['couleur','la']]
     .map(([w,a])=>`<button class="quizopt" style="width:auto;display:inline-block;margin:3px" onclick="this.innerHTML='<b>'+${sattr(a)}+' ${esc(w)}</b>';this.style.borderColor='var(--good)';say(${sattr(a+' '+w)})">${esc(w)} ?</button>`).join('')}</div>
   <div class="muted" style="font-size:12px;margin-top:6px">Devine à voix haute, puis clique pour vérifier + écouter.</div>

 <div class="stage">${icon('user')} 2 · Les pronoms sujets</div>
 <div class="card"><h3>${icon('users')} Qui fait l’action</h3>
   <table><tr><td>je (j’)</td><td>I</td><td>nous</td><td>we</td></tr>
     <tr><td>tu</td><td>you (informal)</td><td>vous</td><td>you (formal / plural)</td></tr>
     <tr><td>il / elle / on</td><td>he / she / we-casual</td><td>ils / elles</td><td>they (m / f)</td></tr></table>
   ${callout('<b>tu vs vous:</b> tu for friends, family, kids; vous for strangers, elders, groups. When unsure, use vous. <b>on</b> = casual “we” and takes the il/elle form: « on va au café ».')}
 </div>

 <div class="stage">${icon('zap')} 3 · Les verbes essentiels</div>
 <div class="card"><h3>${icon('star')} Être &amp; Avoir — apprends-les par cœur</h3>
   ${gconj('ÊTRE — to be',[['je suis','I am'],['tu es','you are'],['il/elle est','he/she is'],['nous sommes','we are'],['vous êtes','you are'],['ils/elles sont','they are']])}
   ${gconj('AVOIR — to have',[['j’ai','I have'],['tu as','you have'],['il/elle a','he/she has'],['nous avons','we have'],['vous avez','you have'],['ils/elles ont','they have']])}
   ${callout('French uses <b>avoir</b> (to HAVE) where English uses “to be”: age (j’ai 20 ans), hunger (j’ai faim), thirst (j’ai soif), fear (j’ai peur). Never « je suis 20 ans ».',true)}
 </div>
 <div class="card"><h3>${icon('play')} Aller &amp; Faire</h3>
   ${gconj('ALLER — to go',[['je vais','I go'],['tu vas','you go'],['il/elle va','he/she goes'],['nous allons','we go'],['vous allez','you go'],['ils/elles vont','they go']])}
   ${gconj('FAIRE — to do / make',[['je fais','I do'],['tu fais','you do'],['il/elle fait','he/she does'],['nous faisons','we do'],['vous faites','you do'],['ils/elles font','they do']])}
   ${callout('<b>aller + infinitive</b> = the near future (“going to”): « je <b>vais manger</b> » = I’m going to eat. The easiest way to talk about the future at A1.')}
 </div>
 <div class="card"><h3>${icon('type')} Les verbes réguliers (présent)</h3>
   <p class="muted">Drop the ending, add the right one. Three families:</p>
   ${gconj('-ER  (parler)  — the huge majority',[['je parle','-e'],['tu parles','-es'],['il parle','-e'],['nous parlons','-ons'],['vous parlez','-ez'],['ils parlent','-ent']])}
   ${gconj('-IR  (finir)',[['je finis','-is'],['tu finis','-is'],['il finit','-it'],['nous finissons','-issons'],['vous finissez','-issez'],['ils finissent','-issent']])}
   ${gconj('-RE  (attendre)',[['j’attends','-s'],['tu attends','-s'],['il attend','—'],['nous attendons','-ons'],['vous attendez','-ez'],['ils attendent','-ent']])}
   ${callout('For -ER verbs the endings <b>-e, -es, -ent</b> are all <b>silent</b> — je parle, tu parles, ils parlent sound identical! Context and the pronoun tell them apart.')}
 </div>

 <div class="stage">${icon('ban')} 4 · La négation</div>
 <div class="card"><h3>${icon('ban')} Le sandwich « ne … pas »</h3>
   <p class="muted">Wrap the verb: <b>ne</b> + verb + <b>pas</b>. In speech the <b>ne</b> often disappears (see Chunks!).</p>
   ${['Je ne parle pas anglais. (I don’t speak English)','Il n’est pas là. (He’s not here)','Je n’ai pas de voiture. (I don’t have a car)'].map(w=>line(w.split(' (')[0],w.match(/\((.*)\)/)[1])).join('')}
   <table style="margin-top:8px"><tr><th>Also</th><th></th></tr><tr><td>ne … jamais</td><td>never</td></tr><tr><td>ne … plus</td><td>no longer</td></tr><tr><td>ne … rien</td><td>nothing</td></tr><tr><td>ne … personne</td><td>nobody</td></tr></table>
   ${callout('After a negative, <b>un / une / des / du</b> all become <b>de</b>: « j’ai une voiture » → « je n’ai <b>pas de</b> voiture ».',true)}
 </div>

 <div class="stage">${icon('help')} 5 · Les questions</div>
 <div class="card"><h3>${icon('help')} Trois façons de demander</h3>
   <table><tr><th>Method</th><th>Register</th><th>Example</th></tr>
     <tr><td>Intonation ↗</td><td>casual</td><td>Tu viens ?</td></tr>
     <tr><td>Est-ce que…</td><td>neutral</td><td>Est-ce que tu viens ?</td></tr>
     <tr><td>Inversion (verb-subject)</td><td>formal</td><td>Viens-tu ?</td></tr></table>
   <p class="muted" style="margin-top:10px"><b>Les mots interrogatifs:</b></p>
   ${[['qui','who'],['que / quoi','what'],['où','where'],['quand','when'],['comment','how'],['combien','how much/many'],['pourquoi','why'],['quel / quelle','which/what']].map(([a,b])=>wc(a,b)).join('')}
   ${callout('In casual speech the question word often lands at the END: « Tu t’appelles <b>comment</b> ? », « Ça coûte <b>combien</b> ? ». That’s the Chunks “question à la fin” shape.')}
 </div>

 <div class="stage">${icon('link')} 6 · Adjectifs, possessifs &amp; prépositions</div>
 <div class="card"><h3>${icon('type')} Les adjectifs s’accordent</h3>
   <p class="muted">Adjectives match the noun in gender &amp; number, and most go <b>after</b> it.</p>
   <table><tr><th>m.</th><th>f.</th><th>m. pl.</th><th>f. pl.</th></tr><tr><td>petit</td><td>petite</td><td>petits</td><td>petites</td></tr><tr><td>grand</td><td>grande</td><td>grands</td><td>grandes</td></tr></table>
   ${['une voiture rouge (a red car)','un petit chien (a small dog)','des grandes maisons (big houses)'].map(w=>wc(w.split(' (')[0],w.match(/\((.*)\)/)[1])).join('')}
   ${callout('A small set of common adjectives go BEFORE the noun — BANGS: <b>B</b>eauty, <b>A</b>ge, <b>N</b>umber, <b>G</b>oodness, <b>S</b>ize. « un <b>petit</b> chien », « une <b>bonne</b> idée », « un <b>grand</b> homme ».')}
 </div>
 <div class="card"><h3>${icon('user')} Les possessifs</h3>

     <tr><td>our</td><td colspan="2">notre</td><td>nos</td></tr><tr><td>your (formal)</td><td colspan="2">votre</td><td>vos</td></tr><tr><td>their</td><td colspan="2">leur</td><td>leurs</td></tr></table>
   ${callout('It matches the <b>noun’s</b> gender, not the owner’s: « <b>sa</b> voiture » = his OR her car (voiture is feminine, so always sa).',true)}
 </div>
 <div class="card"><h3>${icon('signpost')} Les petites prépositions</h3>
   <table><tr><th>à</th><td>to / at</td><td>à Paris, au restaurant (à+le)</td></tr>

     <tr><th>avec / sans</th><td>with / without</td><td>avec toi, sans sucre</td></tr></table>
   ${callout('Contractions are mandatory: à+le=<b>au</b>, à+les=<b>aux</b>, de+le=<b>du</b>, de+les=<b>des</b>. « Je vais <b>au</b> marché », « la porte <b>du</b> café ».',true)}
 </div>

 <div class="card"><h2>${icon('brain')} Quiz — ${QUIZ.length} questions</h2>
   <p class="muted">Covers everything above. Your best score shows on the dashboard.</p>
   <div class="bar"><i id="qbar"></i></div><div id="qbox"></div><div id="qfb" class="muted" style="margin-top:8px"></div>
   <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="qnext" onclick="qNext()" style="display:none">${esc('Suivant')} ${icon('arrow-r')}</button><button class="btn ghost" onclick="qStart()">${icon('refresh')} Recommencer</button><span id="qscore" class="muted" style="align-self:center"></span></div></div>`;
let qi=0,qscore=0,qorder=[];
function qSaveSess(){saveSession('quiz',{qi:qi,qscore:qscore,qorder:qorder});}
function qStart(){qi=0;qscore=0;qorder=QUIZ.map((_,i)=>i);for(let i=qorder.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[qorder[i],qorder[j]]=[qorder[j],qorder[i]];}clearSession('quiz');qDraw();}
function qRestore(){var ss=loadSession('quiz');if(ss&&ss.qorder&&ss.qorder.length&&ss.qi<ss.qorder.length){qi=ss.qi;qscore=ss.qscore;qorder=ss.qorder;qDraw();return true;}return false;}
function qDraw(){const box=document.getElementById('qbox');if(!box)return;document.getElementById('qfb').textContent='';document.getElementById('qnext').style.display='none';
  document.getElementById('qbar').style.width=(qi/QUIZ.length*100)+'%';document.getElementById('qscore').textContent=`Score : ${qscore}/${QUIZ.length}`;
  if(qi>=QUIZ.length){box.innerHTML=`<div class="big" style="font-size:22px">Fini ! 🎉 ${qscore}/${QUIZ.length}</div><p class="muted">${qscore>=16?'Excellent — bases solides.':qscore>=11?'Bien — revois les erreurs.':'Refais le quiz 2–3 fois.'}</p>`;document.getElementById('qbar').style.width='100%';saveQuiz(Math.round(qscore/QUIZ.length*100));clearSession('quiz');if(EN)applyEN(box.parentElement||box);return;}
  const [q,opts]=QUIZ[qorder[qi]];box.innerHTML=`<div class="q" style="font-size:16px;margin-bottom:8px">${esc(q)}</div>`+opts.map((o,i)=>`<button class="quizopt" onclick="qAns(${i},this)">${esc(o)}</button>`).join('');if(EN)applyEN(box.parentElement||box);}
function qAns(i,btn){const[,,correct,exp]=QUIZ[qorder[qi]];document.querySelectorAll('.quizopt').forEach(b=>b.disabled=true);
  if(i===correct){btn.classList.add('correct');qscore++;document.getElementById('qfb').innerHTML='<span class="ok">✓ Correct.</span> '+esc(exp);}
  else{btn.classList.add('wrong');document.querySelectorAll('.quizopt')[correct].classList.add('correct');document.getElementById('qfb').innerHTML='<span style="color:var(--bad)">✗</span> '+esc(exp);}
  document.getElementById('qscore').textContent=`Score : ${qscore}/${QUIZ.length}`;document.getElementById('qnext').style.display='inline-block';qSaveSess();if(EN)applyEN(document.getElementById('qfb').parentElement||document.getElementById('qfb'));}
function qNext(){qi++;qSaveSess();qDraw();}

TABS['Chiffres & Heure']=()=>`

 <h3>Entraînement horloge</h3>
 <div style="text-align:center">
  <svg id="clk" class="clockface" width="180" height="180" viewBox="0 0 100 100">

 <div class="chips">${['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'].map(d=>`<button class="quizopt" style="width:auto;display:inline-block;margin:3px" onclick="say(${sattr(d)})">${d}</button>`).join('')}</div>
 <div class="chips" style="margin-top:6px">${['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'].map(d=>`<button class="quizopt" style="width:auto;display:inline-block;margin:3px" onclick="say(${sattr(d)})">${d}</button>`).join('')}</div>
 <div class="chips" style="margin-top:6px">${['le printemps','l’été','l’automne','l’hiver'].map(d=>`<button class="quizopt" style="width:auto;display:inline-block;margin:3px" onclick="say(${sattr(d)})">${d}</button>`).join('')}</div>
 ${line('Aujourd’hui, c’est lundi. Il est trois heures et demie.','a full example')}</div>`;
let clkText='';
const HW=['douze','une','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze'];
function clockPhrase(h,m){const H=HW[h%12===0?12:h%12];const label=(h%12===1)?'une heure':H+' heures';const nextH=HW[((h%12)+1)===13?1:(h%12)+1];const nextLabel=(((h%12)+1)%12===1)?'une heure':nextH+' heures';
  if(m===0)return `Il est ${label}.`;
  if(m===15)return `Il est ${label} et quart.`;
  if(m===30)return `Il est ${label} et demie.`;
  if(m===45)return `Il est ${nextLabel} moins le quart.`;
  if(m<30)return `Il est ${label} ${NUM.find(x=>x[0]===m)?NUM.find(x=>x[0]===m)[1]:m}.`;
  return `Il est ${nextLabel} moins ${NUM.find(x=>x[0]===(60-m))?NUM.find(x=>x[0]===(60-m))[1]:(60-m)}.`;}
function newClock(){const h=(Math.random()*12|0)||12;const mm=[0,5,10,15,20,30,40,45,50];const m=mm[Math.random()*mm.length|0];
  setHand('mh',(m/60)*360,32);setHand('hh',((h%12)+m/60)/12*360,22);clkText=clockPhrase(h,m);const e=document.getElementById('clkans');e.style.display='none';e.textContent=clkText;}
function setHand(id,deg,len){const el=document.getElementById(id);const r=(deg-90)*Math.PI/180;el.setAttribute('x2',(50+len*Math.cos(r)).toFixed(1));el.setAttribute('y2',(50+len*Math.sin(r)).toFixed(1));}

/* --- rep tracking: every attempt counts, accuracy is irrelevant --- */
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayIndex(){const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}
function chunkOfDay(){return CHUNKS[dayIndex()%CHUNKS.length];}
function addRep(){PROG.chunkReps=(PROG.chunkReps||0)+1;PROG.days=PROG.days||{};const k=todayKey();PROG.days[k]=(PROG.days[k]||0)+1;progSave();updateRepBar();}
function repsToday(){return (PROG.days&&PROG.days[todayKey()])||0;}
function streakDays(){
  PROG.days=PROG.days||{};let n=0;const d=new Date();
  const key=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(!PROG.days[key(d)])d.setDate(d.getDate()-1);           // today not done yet → count from yesterday
  while(PROG.days[key(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function isMine(c){return (PROG.mine||[]).includes(c);}
function toggleMine(c){PROG.mine=PROG.mine||[];PROG.mineDates=PROG.mineDates||{};
  const i=PROG.mine.indexOf(c);
  if(i>=0){PROG.mine.splice(i,1);delete PROG.mineDates[c];}
  else{PROG.mine.push(c);PROG.mineDates[c]=todayKey();}
  progSave();renderChunks();}
/* spaced review: an « à moi » chunk not confirmed for 3+ days comes back for a check */
function reviewDue(){
  PROG.mine=PROG.mine||[];PROG.mineDates=PROG.mineDates||{};
  PROG.mine.forEach(c=>{if(!PROG.mineDates[c])PROG.mineDates[c]=todayKey();}); // migrate old entries
  const now=new Date(todayKey());
  const due=PROG.mine.filter(c=>{const d=new Date(PROG.mineDates[c]);return (now-d)/86400000>=3;});
  return due.length?CHUNKS.find(x=>x.c===due[0]):null;
}
function reviewKeep(c){PROG.mineDates=PROG.mineDates||{};PROG.mineDates[c]=todayKey();addRep();progSave();renderChunks();}
function reviewLost(c){PROG.mine=(PROG.mine||[]).filter(x=>x!==c);delete (PROG.mineDates||{})[c];progSave();renderChunks();}
function updateRepBar(){const el=document.getElementById('repbar');if(el)el.innerHTML=repBarHTML();}
function week7(){ // last 7 days, oldest → today
  const out=[];const d=new Date();d.setDate(d.getDate()-6);
  for(let i=0;i<7;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    out.push({label:'DLMMJVS'[d.getDay()],n:(PROG.days&&PROG.days[k])||0});d.setDate(d.getDate()+1);}
  return out;
}
function weekHTML(){
  const w=week7();const max=Math.max(10,...w.map(x=>x.n));
  return `<div style="display:flex;gap:5px;align-items:flex-end;height:44px;margin-top:8px">
    ${w.map((x,i)=>`<div style="flex:1;text-align:center">
      <div style="height:30px;display:flex;align-items:flex-end"><div style="width:100%;border-radius:3px 3px 0 0;background:${x.n>=10?'var(--good)':x.n>0?'var(--accent)':'var(--card2)'};height:${Math.max(3,x.n/max*30)}px" title="${x.n} reps"></div></div>
      <div class="muted" style="font-size:10px">${x.label}${i===6?'·auj':''}</div></div>`).join('')}</div>`;
}
function repBarHTML(){
  const t=repsToday(),goal=10;
  return `<div style="display:flex;justify-content:space-between;font-size:13px">
    <span class="muted">Aujourd’hui : <b class="ok">${t}</b> reps · Série : <b class="warn">${streakDays()}</b> j · Total : ${PROG.chunkReps||0}</span>
    <span class="muted">${t>=goal?'🎉 Objectif atteint':'Objectif '+goal}</span></div>
   <div class="bar"><i style="width:${Math.min(100,t/goal*100)}%"></i></div>${weekHTML()}`;
}
/* --- snack loop: plays the chunk on repeat so you can shadow hands-free --- */
let loopTimer=null,loopLeft=0;
function stopLoop(){clearTimeout(loopTimer);loopTimer=null;loopLeft=0;try{speechSynthesis.cancel();}catch(e){}}
function loopChunk(text,times){
  stopLoop();loopLeft=times||5;
  const step=()=>{if(loopLeft<=0){stopLoop();return;}loopLeft--;
    say(text,{onend:()=>{loopTimer=setTimeout(step,1100);}});};
  step();
}
/* --- guided 5-min session: the “sit-down way”, hands-free ---
   For each chunk: hear it → gap (you repeat) → hear it slow → gap (you repeat) → next.
   One rep is counted per chunk cycled. */
let SES={on:false,t0:0,i:0,timer:null,clock:null};
function sesStop(msg){SES.on=false;clearTimeout(SES.timer);clearInterval(SES.clock);
  try{speechSynthesis.cancel();}catch(e){}
  const el=document.getElementById('sesui');if(el)el.innerHTML=msg||'';updateRepBar();}
function sesStart(){
  stopLoop();SES.on=true;SES.t0=Date.now();SES.i=CHUNKS.indexOf(chunkOfDay());
  clearInterval(SES.clock);SES.clock=setInterval(()=>sesUI(CHUNKS[SES.i%CHUNKS.length]),1000);
  sesStep();
}
function sesStep(){
  if(!SES.on)return;
  if(Date.now()-SES.t0>300000){sesStop('<div class="ok" style="font-size:16px;margin-top:10px">🎉 Session de 5 minutes finie — toutes tes reps sont comptées. À demain !</div>');return;}
  const ch=CHUNKS[SES.i%CHUNKS.length];
  sesUI(ch);
  // normal → you repeat → slow → you repeat → NATIVE SPEED → you chase it → next
  say(ch.c,{onend:()=>{SES.timer=setTimeout(()=>{if(!SES.on)return;
    say(ch.c,{rate:0.6,onend:()=>{SES.timer=setTimeout(()=>{if(!SES.on)return;
      say(ch.c,{rate:1.15,onend:()=>{SES.timer=setTimeout(()=>{if(!SES.on)return;
        addRep();SES.i++;sesStep();},2000);}});
    },2400);}});
  },2400);}});
}
function sesUI(ch){
  const el=document.getElementById('sesui');if(!el||!SES.on)return;
  const left=Math.max(0,300-Math.round((Date.now()-SES.t0)/1000));
  el.innerHTML=`<div class="card" style="margin:10px 0 0;background:var(--card2);border-color:var(--fr)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>▶ Session en cours</b><span class="warn">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span></div>
    <div style="font-size:22px;font-weight:800;margin:8px 0">${ch?esc(ch.c):''}</div>
    ${ch?`<div class="muted" style="font-size:12px">👂 ${esc(ch.s)} ➜ ${esc(ch.m)}</div>`:''}
    <div class="muted" style="font-size:12px;margin-top:6px">Écoute → répète · lentement 🐢 → répète · <b>vitesse native ⚡</b> → essaie de suivre. Pas besoin de toucher l’écran.</div>
    <button class="btn ghost" style="margin-top:10px" onclick="sesStop()">■ Arrêter</button></div>`;
  if(EN)applyEN(el);
}

function countManual(){addRep();const el=document.getElementById('manualmsg');if(el)el.innerHTML='<span class="ok">✅ Rep compté ! C’est ça le jeu — répète-le encore ce soir.</span>';}
function chunkCard(ch,i,big){
  const mine=isMine(ch.c);
  return `<div class="card" style="background:var(--card2)">
    <div class="muted" style="font-size:12px">${esc(ch.cat)}</div>
    <div style="font-size:${big?26:20}px;font-weight:800;margin:6px 0;line-height:1.25">${esc(ch.c)}</div>
    <div class="muted" style="font-size:13px">👂 ça sonne comme : <span class="lit"><b>${esc(ch.s)}</b></span></div>
    <div style="margin-top:4px">➜ <b>${esc(ch.m)}</b></div>
    ${ch.w?`<div class="muted" style="margin-top:6px;font-size:13px">💡 ${esc(ch.w)}</div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="btn ghost" onclick="say(${sattr(ch.c)})">${SPK}</button>
      <button class="btn ghost" onclick="say(${sattr(ch.c)},{rate:0.55})">🐢 Lent</button>
      <button class="btn ghost" onclick="say(${sattr(ch.c)},{rate:1.15})">⚡ Vite</button>
      <button class="btn ghost" onclick="loopChunk(${sattr(ch.c)},5)">🔁 Snack ×5</button>
      <button class="btn" id="cbtn${i}" onclick="chunkMic(${i},${sattr(ch.c)})">🎤 Shadow</button>
      <button class="btn ghost" onclick="toggleMine(${sattr(ch.c)})">${mine?'✅ À moi':'☆ « À moi »'}</button>
    </div>
    <div id="cint${i}" class="muted" style="margin-top:6px;min-height:16px;font-size:12px"></div>
    <div id="cfb${i}" style="margin-top:4px"></div>
    ${anat(ch.c)}
  </div>`;
}

    body=`<div class="card"><h2>${icon('brain')} Pourquoi ça marche</h2>
      <ul class="muted" style="margin:8px 0 0 18px;padding:0">
        <li><b>Chunks, pas mots.</b> Fast French isn’t fast words — it’s whole phrases delivered as one block of sound. Decode word-by-word and you fall behind.</li>
        <li><b>Prédiction.</b> Signals like <i>et toi…</i> or <i>du coup…</i> tell you what’s coming <i>before</i> the important words arrive. That’s your head start.</li>
        <li><b>La bouche entraîne l’oreille.</b> When your mouth can produce the chunk, your ear suddenly catches it at speed. Saying it beats reading it.</li>
        <li><b>Vrai français ≠ livre.</b> Nobody says <i>il n’y a pas</i> — they say <i>y a pas</i>. Shadow the real thing.</li>
        <li><b>Vitesse & tolérance.</b> You can’t pause mid-phrase, so you learn to stay in the flow instead of freezing.</li>
        <li><b>5 min/jour &gt; 1 h/semaine.</b> One chunk a day = 300+ pieces of real French a year.</li>
      </ul>
      <h3>Comment pratiquer</h3>
      <p class="muted"><b>1 · Assis (5 min).</b> Pick a chunk, listen, get the meaning, shadow it until it feels like yours.<br>
      <b>2 · Sans bureau (snacks).</b> Replay it walking, doing dishes, in a queue. Tiny reps, all day. That’s where the real gains are.</p>
      <p class="muted"><b>Le score :</b> chaque chunk passe du tas « je n’ai pas capté » au tas « c’est à moi ». Marque-les avec ☆ « À moi ».</p></div>`;
  }
  const mine=(PROG.mine||[]).length;
  return `<div class="card"><h2>${icon('headphones')} Chunks & Shadowing</h2>
    <div id="repbar">${repBarHTML()}</div>
    <div class="muted" style="font-size:13px;margin-top:6px">« À moi » : <b class="ok">${mine}</b> / ${CHUNKS.length} chunks</div>
    <div class="catnav" style="margin-top:10px">${vnav}</div></div>${body}`;
};

function lookupUI(t){
  if(UI_EN[t]) return UI_EN[t];
  const noCheck=t.replace(/^✅\s*/,'');
  if(noCheck!==t && UI_EN[noCheck]) return '✅ '+UI_EN[noCheck];
  return null;
}
function applyPartial(s){UI_EN_PARTIAL.forEach(([re,rep])=>{s=s.replace(re,rep);});return s;}
let OBS=null;
function translateNodes(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(node=>{
    const raw=node.nodeValue,trimmed=raw.trim();if(!trimmed)return;
    if(EN){
      if(node.__frOrig!=null)return;
      const exact=lookupUI(trimmed);
      if(exact){node.__frOrig=raw;node.nodeValue=raw.replace(trimmed,exact);return;}
      const swapped=applyPartial(raw);
      if(swapped!==raw){node.__frOrig=raw;node.nodeValue=swapped;}
    } else {
      if(node.__frOrig!=null){node.nodeValue=node.__frOrig;node.__frOrig=null;}
    }
  });
}
function translateAttrs(root){
  root.querySelectorAll('[placeholder],[title]').forEach(el=>{
    ['placeholder','title'].forEach(attr=>{
      if(!el.hasAttribute(attr))return;
      const key='__fr'+attr;
      if(EN){
        if(el[key]!=null)return;
        const cur=el.getAttribute(attr),t=lookupUI(cur.trim());
        if(t){el[key]=cur;el.setAttribute(attr,t);}
      } else if(el[key]!=null){el.setAttribute(attr,el[key]);el[key]=null;}
    });
  });
}
function applyEN(root){
  root=root||document.body;
  if(OBS)OBS.disconnect();
  translateNodes(root);translateAttrs(root);
  if(OBS)OBS.observe(document.body,{childList:true,subtree:true,characterData:true});
}
let enObsPending=false;
const enObsTargets=new Set();
OBS=new MutationObserver(muts=>{
  if(!EN)return;
  muts.forEach(m=>{const el=m.target.nodeType===1?m.target:m.target.parentElement;if(el)enObsTargets.add(el);});
  if(enObsPending)return;
  enObsPending=true;
  setTimeout(()=>{
    enObsPending=false;
    const targets=[...enObsTargets];enObsTargets.clear();
    targets.forEach(el=>{if(document.body.contains(el))applyEN(el);});
  },0);
});
OBS.observe(document.body,{childList:true,subtree:true,characterData:true});
function toggleEN(){
  EN=!EN;localStorage.setItem('frEN',EN?'1':'0');
  applyEN(document.body);
  const btn=document.getElementById('enToggle');
  if(btn){btn.classList.toggle('active',EN);btn.innerHTML=icon('globe')+(EN?' Français':' English');}
  cloudSyncPrefs();
}
